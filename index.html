<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>智慧儲存庫與食品過期管理系統</title>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef2f5;--card:#fff;--sub:#f6f8fa;--bd:#dde3e9;--tx:#26313c;--mu:#6b7785;--pri:#2f80c9;--ok:#27a35a;--warn:#e67e22;--bad:#d9453a;--pur:#7b4bb0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#14181d;--card:#1d232a;--sub:#252c34;--bd:#36404a;--tx:#e6ebf0;--mu:#93a0ad;--pri:#5aa6ee;--ok:#3bc577;--warn:#f0974a;--bad:#f06a60;--pur:#b08be0}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#14181d;--card:#1d232a;--sub:#252c34;--bd:#36404a;--tx:#e6ebf0;--mu:#93a0ad;--pri:#5aa6ee;--ok:#3bc577;--warn:#f0974a;--bad:#f06a60;--pur:#b08be0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Roboto,sans-serif;padding:14px}
.wrap{max-width:560px;margin:0 auto}
.panel{background:var(--card);border-radius:14px;padding:18px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
h1{font-size:20px;text-align:center;margin:0 0 14px}
h3{margin:0 0 8px;font-size:15px;border-bottom:2px solid var(--bd);padding-bottom:6px}
.card{background:var(--sub);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
label{display:block;margin-top:10px;font-weight:600;font-size:13px}
input,select{width:100%;padding:11px;margin-top:5px;border:1px solid var(--bd);border-radius:8px;font-size:16px;background:var(--card);color:var(--tx)}
button{background:var(--pri);color:#fff;border:0;padding:12px;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;min-height:44px}
button:disabled{opacity:.55}
.full{width:100%;margin-top:12px}.ok{background:var(--ok)}.warn{background:var(--warn)}.bad{background:var(--bad)}.pur{background:var(--pur)}.ghost{background:transparent;color:var(--pri);border:1px solid var(--bd)}
.row{display:flex;gap:6px;align-items:center}.row>*{margin-top:5px}
.msg{font-size:13px;min-height:18px;margin-top:8px;color:var(--bad)}.msg.good{color:var(--ok)}
.hint{font-size:12px;color:var(--mu);margin-top:4px}
/* login */
#login{max-width:400px;margin:6vh auto 0}
#login .logo{font-size:46px;text-align:center}
.ulist{display:grid;gap:8px;margin:12px 0}
.ubtn{display:flex;align-items:center;gap:12px;background:var(--sub);color:var(--tx);border:1px solid var(--bd);text-align:left;padding:10px 12px;width:100%}
.ubtn.sel{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri) inset}
.av{width:38px;height:38px;border-radius:50%;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.pw{position:relative}.pw button{position:absolute;right:4px;top:9px;background:none;color:var(--mu);padding:6px 10px;min-height:0;font-size:13px}
.seg{display:flex;gap:6px;margin-bottom:6px}.seg button{flex:1;background:var(--sub);color:var(--mu);border:1px solid var(--bd)}.seg button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.chk{display:flex;gap:8px;align-items:center;font-weight:400;margin-top:12px}.chk input{width:auto;margin:0}
/* app */
.bar{display:flex;justify-content:space-between;align-items:center;background:var(--sub);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;margin-bottom:14px;font-size:14px}
.bar button{padding:6px 12px;font-size:12px;min-height:36px}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{flex:1;background:var(--bd);color:var(--mu)}.tabs button.on{background:var(--pri);color:#fff}
.tc{display:none}.tc.on{display:block}
#reader{width:100%;margin-top:8px}#preview{width:100%;max-height:200px;object-fit:contain;margin-top:8px;display:none;border-radius:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.chips button{padding:6px 10px;font-size:12px;min-height:36px;background:var(--sub);color:var(--pri);border:1px solid var(--bd)}
.sum{display:flex;gap:8px;margin-bottom:10px}.sum div{flex:1;text-align:center;border-radius:8px;padding:8px;font-size:12px;background:var(--sub);border:1px solid var(--bd)}
.sum b{display:block;font-size:20px}.sum .e b{color:var(--bad)}.sum .s b{color:var(--warn)}
.item{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--bd);border-radius:8px;padding:10px;margin-top:8px}
.item.expired{border-left-color:var(--bad)}.item.soon{border-left-color:var(--warn)}
.item .th{width:52px;height:52px;border-radius:8px;object-fit:cover;background:var(--sub);flex:none;display:flex;align-items:center;justify-content:center;font-size:26px}
.info{flex:1;font-size:13px;line-height:1.5;min-width:0;word-break:break-word}
.tag-e{color:var(--bad);font-weight:700}.tag-s{color:var(--warn);font-weight:700}
.acts{display:flex;flex-direction:column;gap:4px}.acts button{padding:6px 10px;font-size:13px;min-height:38px}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.tools button{flex:1;font-size:13px}
</style>
</head>
<body>
<div class="wrap">

<!-- 登入畫面 -->
<div id="login" class="panel" hidden>
  <div class="logo">📦</div>
  <h1>智慧儲存庫與食品管理</h1>
  <div id="seg" class="seg"><button id="segIn" class="on" onclick="setMode('in')">登入</button><button id="segUp" onclick="setMode('up')">新增使用者</button></div>
  <div id="inBox">
    <div id="ulist" class="ulist"></div>
    <form id="pwForm" onsubmit="doLogin(event)" hidden>
      <label id="pwLabel">密碼</label>
      <div class="pw"><input type="password" id="loginPw" autocomplete="current-password" required><button type="button" onclick="togglePw('loginPw',this)">顯示</button></div>
      <label class="chk"><input type="checkbox" id="remember"> 在此裝置保持登入</label>
      <button class="full" type="submit">登入</button>
    </form>
  </div>
  <form id="upBox" onsubmit="doRegister(event)" hidden>
    <label>使用者名稱</label><input id="regName" maxlength="20" autocomplete="username" placeholder="例如：媽媽" required>
    <label>密碼（至少 4 碼）</label><div class="pw"><input type="password" id="regPw" autocomplete="new-password" required><button type="button" onclick="togglePw('regPw',this)">顯示</button></div>
    <label>再次輸入密碼</label><input type="password" id="regPw2" autocomplete="new-password" required>
    <button class="full ok" type="submit">註冊並登入</button>
  </form>
  <div id="loginMsg" class="msg" role="alert"></div>
  <p class="hint">提醒：此為純前端登入，資料存在本機瀏覽器，只能防止誤點，無法取代真正的伺服器安全機制。請定期匯出備份。</p>
</div>

<!-- 主程式 -->
<div id="app" class="panel" hidden>
  <h1>📦 智慧儲存庫與食品管理</h1>
  <div class="bar"><div>👤 <b id="uname"></b></div><div class="row"><button class="ghost" onclick="logout()">登出</button></div></div>
  <div class="tabs"><button id="t1" class="on" onclick="tab('formTab')">📝 物品入庫</button><button id="t2" onclick="tab('listTab')">📋 庫存清單</button></div>

  <div id="formTab" class="tc on">
    <form id="itemForm" onsubmit="saveItem(event)">
      <div class="card">
        <h3>1. 儲存庫與儲位</h3>
        <label>入庫儲存庫</label><select id="storageSel"></select>
        <label>新增自訂儲存庫</label>
        <div class="row"><input id="newStorage" placeholder="例如：💊 藥品急救箱"><button type="button" onclick="addStorage()" style="white-space:nowrap">新增</button></div>
        <label>儲位編號（可由 NFC 網址帶入）</label><input id="loc" placeholder="例如：抽屜-A1">
        <details style="margin-top:12px"><summary style="cursor:pointer;font-size:13px;font-weight:600">🔄 倉庫管理（轉移／刪除）</summary>
          <label>來源倉庫</label><select id="srcSel"></select>
          <label>轉移到</label>
          <div class="row"><select id="dstSel"></select><button type="button" class="pur" onclick="transfer()" style="white-space:nowrap">轉移</button></div>
          <button type="button" class="bad full" onclick="delStorage()">刪除來源倉庫（物品需先轉移）</button>
        </details>
      </div>
      <div class="card">
        <h3>2. 物品辨識與拍照</h3>
        <button type="button" class="pur full" id="scanBtn" onclick="toggleScan()">📷 掃描商品條碼</button>
        <div id="reader"></div>
        <label>條碼編號</label><input id="barcode" inputmode="numeric" placeholder="掃描後自動填入">
        <label>拍攝物品照片</label><input type="file" id="photo" accept="image/*" capture="environment" onchange="onPhoto(event)">
        <img id="preview" alt="預覽">
        <button type="button" class="warn full" id="aiBtn" onclick="runAI()" disabled>⏳ AI 模型載入中…</button>
        <div id="aiMsg" class="hint"></div>
      </div>
      <div class="card">
        <h3 id="f3">3. 詳細資訊與有效期限</h3>
        <label>物品名稱</label><input id="name" required maxlength="60">
        <label>有效期限（食品適用）</label><input type="date" id="exp">
        <div class="chips"><button type="button" onclick="addDays(7)">+7 天</button><button type="button" onclick="addDays(30)">+30 天</button><button type="button" onclick="addDays(90)">+90 天</button><button type="button" onclick="addDays(180)">+半年</button><button type="button" onclick="addDays(365)">+1 年</button></div>
        <label>數量</label><input type="number" id="qty" value="1" min="1" required>
        <button class="ok full" id="saveBtn" type="submit">💾 儲存入庫</button>
        <button class="ghost full" id="cancelEdit" type="button" onclick="resetForm()" hidden>取消編輯</button>
      </div>
    </form>
  </div>

  <div id="listTab" class="tc">
    <div class="sum"><div class="e"><b id="cE">0</b>已過期</div><div class="s"><b id="cS">0</b>7 天內到期</div><div><b id="cA">0</b>全部</div></div>
    <div class="row"><select id="fStore" onchange="render()"></select><input id="fText" placeholder="🔍 搜尋名稱／儲位／條碼" oninput="render()"></div>
    <div id="list"></div>
    <div class="tools"><button class="ghost" onclick="exportData()">⬇ 匯出備份</button><button class="ghost" onclick="document.getElementById('imp').click()">⬆ 匯入備份</button></div>
    <input type="file" id="imp" accept="application/json" hidden onchange="importData(event)">
  </div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DEF=[{id:'wardrobe',name:'🧥 臥室衣櫃'},{id:'toolbox',name:'🔧 工具箱'},{id:'pantry',name:'🍫 零食雜物櫃'}];
let user='',items=[],storages=[],photo='',editId=null,model=null,scanner=null,scanning=false,selUser='',mode='in';

/* ---------- 儲存（含錯誤處理） ---------- */
function lget(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lset(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){alert('⚠️ 儲存失敗（空間不足或被瀏覽器禁止）。請先匯出備份並刪除部分照片。');return false}}
function sget(k){try{return sessionStorage.getItem(k)}catch(e){return null}}
function sset(k,v){try{v==null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v)}catch(e){}}
function persist(){lset('items_'+user,items)&&lset('storages_'+user,storages)}

/* ---------- 密碼雜湊 ---------- */
function rnd(){const a=new Uint8Array(16);crypto.getRandomValues(a);return [...a].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function hash(pw,salt){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+pw));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function users(){const u=lget('inv_users',{});const old=lget('app_users_secure',{});
  for(const n in old){if(!u[n])u[n]={legacy:old[n]}} return u}
function saveUsers(u){const old=lget('app_users_secure',{});for(const n in u){if(!u[n].legacy)delete old[n]}lset('app_users_secure',old);
  const clean={};for(const n in u)clean[n]=u[n];lset('inv_users',clean)}

/* ---------- 登入 UI ---------- */
function msg(t,good){const m=$('loginMsg');m.textContent=t||'';m.className='msg'+(good?' good':'')}
function setMode(m){mode=m;msg('');$('inBox').hidden=m!=='in';$('upBox').hidden=m!=='up';$('segIn').classList.toggle('on',m==='in');$('segUp').classList.toggle('on',m==='up')}
function togglePw(id,b){const i=$(id);i.type=i.type==='password'?'text':'password';b.textContent=i.type==='password'?'顯示':'隱藏'}
function showLogin(){
  $('app').hidden=true;$('login').hidden=false;selUser='';$('pwForm').hidden=true;
  const u=users(),names=Object.keys(u),box=$('ulist');box.innerHTML='';
  names.forEach(n=>{const b=document.createElement('button');b.type='button';b.className='ubtn';
    b.innerHTML='<span class="av">'+esc([...n][0]||'?')+'</span><span>'+esc(n)+'</span>';
    b.onclick=()=>{selUser=n;[...box.children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');
      $('pwForm').hidden=false;$('pwLabel').textContent='「'+n+'」的密碼';$('loginPw').value='';msg('');$('loginPw').focus()};
    box.appendChild(b)});
  if(!names.length){setMode('up');$('segIn').disabled=true;msg('尚無任何使用者，請先建立第一個帳號。',true)}
  else{$('segIn').disabled=false;setMode('in')}
}
async function doLogin(e){
  e.preventDefault();const pw=$('loginPw').value,u=users(),rec=u[selUser];
  if(!rec){msg('請先選擇使用者');return}
  let ok=false;
  if(rec.legacy!==undefined){ok=rec.legacy===pw;if(ok){const salt=rnd();u[selUser]={salt,hash:await hash(pw,salt)};saveUsers(u)}}
  else ok=(await hash(pw,rec.salt))===rec.hash;
  if(!ok){msg('❌ 密碼錯誤');$('loginPw').select();return}
  enter(selUser,$('remember').checked)
}
async function doRegister(e){
  e.preventDefault();const n=$('regName').value.trim(),p=$('regPw').value,p2=$('regPw2').value,u=users();
  if(!n){msg('請輸入使用者名稱');return}
  if(u[n]){msg('此名稱已存在，請改用登入');return}
  if(p.length<4){msg('密碼至少 4 碼');return}
  if(p!==p2){msg('兩次密碼不一致');return}
  const salt=rnd();u[n]={salt,hash:await hash(p,salt)};saveUsers(u);
  $('regName').value=$('regPw').value=$('regPw2').value='';enter(n,false)
}
function enter(n,remember){
  user=n;sset('inv_cur',n);try{remember?localStorage.setItem('inv_remember',n):localStorage.removeItem('inv_remember')}catch(e){}
  items=lget('items_'+n,[]);storages=lget('storages_'+n,null);
  if(!storages||!storages.length){storages=JSON.parse(JSON.stringify(DEF));persist()}
  $('login').hidden=true;$('app').hidden=false;$('uname').textContent=n;
  fillStores();resetForm();tab('formTab');
  const p=new URLSearchParams(location.search);if(p.get('storage')&&storages.some(s=>s.id===p.get('storage')))$('storageSel').value=p.get('storage');
  if(p.get('loc'))$('loc').value=p.get('loc');
}
function logout(){stopScan();user='';sset('inv_cur',null);try{localStorage.removeItem('inv_remember')}catch(e){}showLogin()}

/* ---------- 儲存庫 ---------- */
function fillStores(keep){
  const last=keep||$('storageSel').value;
  ['storageSel','srcSel','dstSel'].forEach(id=>{const s=$(id);s.innerHTML='';storages.forEach(x=>s.add(new Option(x.name,x.id)))});
  const f=$('fStore');const fv=f.value;f.innerHTML='';f.add(new Option('全部儲存庫',''));storages.forEach(x=>f.add(new Option(x.name,x.id)));f.value=fv;
  if(last&&storages.some(s=>s.id===last))$('storageSel').value=last;
}
function addStorage(){const n=$('newStorage').value.trim();if(!n){alert('請輸入名稱');return}
  const id='store_'+Date.now();storages.push({id,name:n});persist();$('newStorage').value='';fillStores(id)}
function transfer(){const a=$('srcSel').value,b=$('dstSel').value;if(a===b){alert('來源與目標不能相同');return}
  const A=storages.find(s=>s.id===a),B=storages.find(s=>s.id===b);
  if(!confirm('確定將「'+A.name+'」所有物品轉移到「'+B.name+'」？'))return;
  let c=0;items.forEach(i=>{if(i.storageId===a){i.storageId=b;c++}});persist();render();alert('✅ 已轉移 '+c+' 項')}
function delStorage(){const a=$('srcSel').value;
  if(items.some(i=>i.storageId===a)){alert('此倉庫仍有物品，請先轉移。');return}
  if(storages.length<=1){alert('至少要保留一個儲存庫');return}
  if(!confirm('確定刪除這個儲存庫？'))return;storages=storages.filter(s=>s.id!==a);persist();fillStores()}

/* ---------- 分頁 ---------- */
function tab(id){stopScan();['formTab','listTab'].forEach(t=>$(t).classList.toggle('on',t===id));
  $('t1').classList.toggle('on',id==='formTab');$('t2').classList.toggle('on',id==='listTab');if(id==='listTab')render()}

/* ---------- 條碼 ---------- */
function toggleScan(){scanning?stopScan():startScan()}
async function startScan(){
  if(typeof Html5Qrcode==='undefined'){alert('條碼掃描元件載入失敗，請手動輸入條碼。');return}
  try{scanner=scanner||new Html5Qrcode('reader');scanning=true;$('scanBtn').textContent='⏹ 停止掃描';
    await scanner.start({facingMode:'environment'},{fps:10,qrbox:200},async t=>{$('barcode').value=t;await stopScan();lookup(t)},()=>{})
  }catch(err){scanning=false;$('scanBtn').textContent='📷 掃描商品條碼';alert('相機啟動失敗：'+(err&&err.message||err)+'\n請確認已允許相機權限，或手動輸入條碼。')}
}
async function stopScan(){if(scanner&&scanning){scanning=false;try{await scanner.stop();scanner.clear()}catch(e){}}scanning=false;const b=$('scanBtn');if(b)b.textContent='📷 掃描商品條碼'}
async function lookup(code){
  $('aiMsg').textContent='🔎 查詢商品資料…';
  try{const r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(code)+'.json?fields=product_name,product_name_zh,brands');
    const j=await r.json();const p=j.product||{};const n=p.product_name_zh||p.product_name;
    if(n){$('name').value=(p.brands?p.brands.split(',')[0]+' ':'')+n;$('aiMsg').textContent='✅ 已帶入商品名稱，請確認'}else $('aiMsg').textContent='查無此條碼，請手動輸入名稱'
  }catch(e){$('aiMsg').textContent='無法連線商品資料庫，請手動輸入名稱'}
}

/* ---------- 照片與 AI ---------- */
function compress(url,max=320){return new Promise(res=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height));const c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.7))};i.onerror=()=>res('');i.src=url})}
function onPhoto(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=async ev=>{photo=await compress(ev.target.result);const p=$('preview');p.src=photo;p.style.display='block'};r.readAsDataURL(f)}
async function loadModel(){
  const b=$('aiBtn');
  try{if(typeof mobilenet==='undefined')throw 0;model=await mobilenet.load({version:2,alpha:1});b.disabled=false;b.textContent='✨ 執行本地 AI 分析（僅供參考）'}
  catch(e){b.textContent='AI 模型無法載入（可手動輸入）'}
}
const ZH={'pill bottle':'藥瓶','water bottle':'水瓶','wine bottle':'酒瓶','beer bottle':'啤酒瓶','screwdriver':'螺絲起子','hammer':'鎚子','pop bottle':'汽水瓶','banana':'香蕉','orange':'柳橙','lemon':'檸檬','pineapple':'鳳梨','strawberry':'草莓','pizza':'披薩','cheeseburger':'漢堡','hotdog':'熱狗','ice cream':'冰淇淋','espresso':'濃縮咖啡','eggnog':'蛋酒','carton':'紙盒','jean':'牛仔褲','sweatshirt':'運動衫','sock':'襪子','backpack':'背包','plunger':'馬桶疏通器','power drill':'電鑽','wrench':'扳手','flashlight':'手電筒','lipstick':'口紅','sunscreen':'防曬乳','soap dispenser':'洗手乳','toilet tissue':'衛生紙','mixing bowl':'調理碗'};
async function runAI(){
  const p=$('preview');if(!photo||p.style.display==='none'){alert('請先拍照');return}
  const b=$('aiBtn');b.disabled=true;b.textContent='⏳ 分析中…';
  try{const pr=await model.classify(p,3);
    const top=pr[0].className.split(',')[0].trim();const zh=ZH[top.toLowerCase()];
    $('name').value=zh||top;$('aiMsg').textContent='💡 AI 建議：'+pr.map(x=>x.className.split(',')[0]+' '+Math.round(x.probability*100)+'%').join('、')+'（請確認或修改名稱）'
  }catch(e){$('aiMsg').textContent='辨識失敗，請手動輸入'}
  b.disabled=false;b.textContent='✨ 執行本地 AI 分析（僅供參考）'
}

/* ---------- 入庫／編輯 ---------- */
function addDays(n){const d=new Date();d.setDate(d.getDate()+n);$('exp').value=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function saveItem(e){
  e.preventDefault();
  const data={storageId:$('storageSel').value,location:$('loc').value.trim(),barcode:$('barcode').value.trim(),name:$('name').value.trim(),expiryDate:$('exp').value,qty:parseInt($('qty').value)||1};
  if(editId){const it=items.find(i=>i.id===editId);Object.assign(it,data);if(photo)it.photo=photo}
  else items.push({id:Date.now(),photo,...data});
  if(!persistOk())return;
  const keep=data.storageId,was=editId;resetForm(keep);render();
  if(was)tab('listTab');else $('aiMsg').textContent='✅ 已入庫'
}
function persistOk(){return lset('items_'+user,items)}
function resetForm(keep){editId=null;$('itemForm').reset();photo='';$('preview').style.display='none';$('preview').removeAttribute('src');
  $('f3').textContent='3. 詳細資訊與有效期限';$('saveBtn').textContent='💾 儲存入庫';$('cancelEdit').hidden=true;$('aiMsg').textContent='';
  if(keep)$('storageSel').value=keep}
function editItem(id){const it=items.find(i=>i.id===id);if(!it)return;editId=id;tab('formTab');
  $('storageSel').value=it.storageId;$('loc').value=it.location||'';$('barcode').value=it.barcode||'';$('name').value=it.name;$('exp').value=it.expiryDate||'';$('qty').value=it.qty;
  photo='';if(it.photo){$('preview').src=it.photo;$('preview').style.display='block'}
  $('f3').textContent='✏️ 編輯物品';$('saveBtn').textContent='💾 更新物品';$('cancelEdit').hidden=false;window.scrollTo({top:0,behavior:'smooth'})}
function outItem(id){const it=items.find(i=>i.id===id);if(!it)return;
  const s=prompt('「'+it.name+'」目前數量 '+it.qty+'，請輸入出庫數量：','1');if(s===null)return;const n=parseInt(s);
  if(isNaN(n)||n<=0){alert('請輸入有效的正整數');return}
  if(n>=it.qty){if(!confirm('數量已用完，是否從清單移除？'))return;items=items.filter(i=>i.id!==id)}else it.qty-=n;
  persistOk();render()}
function delItem(id){if(!confirm('確定徹底刪除此筆記錄？'))return;items=items.filter(i=>i.id!==id);persistOk();render()}

/* ---------- 清單 ---------- */
function expStatus(d){if(!d)return{k:9999,cls:'',t:'無'};
  const days=Math.ceil((new Date(d+'T00:00:00')-new Date().setHours(0,0,0,0))/864e5);
  if(days<0)return{k:days,cls:'expired',t:esc(d)+' <span class="tag-e">（已過期 '+(-days)+' 天）</span>'};
  if(days<=7)return{k:days,cls:'soon',t:esc(d)+' <span class="tag-s">（剩 '+days+' 天）</span>'};
  return{k:days,cls:'',t:esc(d)}}
function render(){
  const box=$('list'),fs=$('fStore').value,q=$('fText').value.trim().toLowerCase();
  const all=items.map(i=>({i,s:expStatus(i.expiryDate)}));
  $('cE').textContent=all.filter(x=>x.s.cls==='expired').length;$('cS').textContent=all.filter(x=>x.s.cls==='soon').length;$('cA').textContent=items.length;
  const rows=all.filter(x=>(!fs||x.i.storageId===fs)&&(!q||[x.i.name,x.i.location,x.i.barcode].join(' ').toLowerCase().includes(q))).sort((a,b)=>a.s.k-b.s.k);
  if(!rows.length){box.innerHTML='<p class="hint" style="text-align:center;padding:20px">'+(items.length?'沒有符合條件的物品':'目前沒有任何庫存資料')+'</p>';return}
  box.innerHTML=rows.map(({i,s})=>{const st=storages.find(x=>x.id===i.storageId);
    const th=i.photo?'<img class="th" alt="" src="'+esc(i.photo)+'">':'<div class="th">📦</div>';
    return '<div class="item '+s.cls+'">'+th+'<div class="info"><strong>'+esc(i.name)+'</strong>（數量 <strong>'+esc(i.qty)+'</strong>）<br>📍 '+esc(st?st.name:'未知分類')+(i.location?' / '+esc(i.location):'')+'<br>⏳ '+s.t+'</div>'+
    '<div class="acts"><button class="warn" onclick="outItem('+i.id+')">出庫</button><button onclick="editItem('+i.id+')">編輯</button><button class="bad" onclick="delItem('+i.id+')">刪除</button></div></div>'}).join('')}

/* ---------- 匯出／匯入 ---------- */
function exportData(){const b=new Blob([JSON.stringify({user,storages,items},null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='inventory-'+user+'-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove()}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.items)||!Array.isArray(d.storages))throw 0;
    if(!confirm('匯入將覆蓋目前帳號的所有資料（'+d.items.length+' 項物品），確定？'))return;
    items=d.items;storages=d.storages;persist();fillStores();render();alert('✅ 匯入完成')}catch(x){alert('檔案格式不正確')}};
  r.readAsText(f);e.target.value=''}

/* ---------- 啟動 ---------- */
(function(){
  const u=users();let cur=sget('inv_cur');
  if(!cur){try{cur=localStorage.getItem('inv_remember')}catch(e){}}
  if(cur&&u[cur])enter(cur,!!(function(){try{return localStorage.getItem('inv_remember')}catch(e){return null}})());else showLogin();
  loadModel();
})();
</script>
