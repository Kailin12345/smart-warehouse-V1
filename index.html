<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NFC Smart Inventory（NFC 智慧貼紙倉庫）</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            slate: {
              850: '#162032',
              950: '#090D16',
            },
            cyan: {
              accent: '#06B6D4',
              bright: '#22D3EE',
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @keyframes pulse-subtle {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.08); opacity: 0.8; }
    }
    .animate-pulse-subtle {
      animation: pulse-subtle 2s infinite ease-in-out;
    }
    /* Hide scrollbars for clean linear UI */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-[#090D16] text-slate-100 min-h-screen font-sans antialiased selection:bg-cyan-500 selection:text-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- 預設測試資料 (Initial Realistic Warehouses & Items) ---
    const INITIAL_WAREHOUSES = [

      },
      {

      },
      {
        id: "wh-3",
        nfc_uid: "04:B5:12:F1",
        name: "儲藏室五金工具箱",
        icon: "🧰",
        description: "電動衝擊電鑽、起子頭模組、水平尺、手工具組",

      },
      {
        id: "wh-4",
        nfc_uid: "04:78:E4:2A",
        name: "主臥室換季衣物箱",
        icon: "🧥",
        description: "換季厚重羽絨外套、保暖羊毛圍巾、發熱衣物防潮收納",
        updated_at: new Date(Date.now() - 1000 * 60 * 360).toISOString()

      {
        id: "wh-5",
        nfc_uid: "04:C9:88:54",
        name: "車庫野營野炊裝備箱",
        icon: "⛺",
        description: "SOTO 蜘蛛爐、鈦金屬杯、高山瓦斯罐與戶外料理裝備",
        updated_at: new Date(Date.now() - 1000 * 60 * 720).toISOString()
      },
      {
        id: "wh-6",

        name: "書房防潮保險箱",
        icon: "🔐",
        description: "重要合約副本、權狀證明、年度報稅文件資料夾",

      }
    ];

    const ONE_DAY_MS = 24 * 60 * 60 * 1000;
    const now = Date.now();

    const INITIAL_ITEMS = [
      // 廚房冰箱
      {
        id: "item-1",
        nfc_uid: null,
        name: "北海道特級鮮乳 936ml",
        category: "食品生鮮",
        location: "廚房冰箱 - 冷藏庫",
        quantity: 2,
        notes: "保存期限即將於 2 天後到期，請儘速飲用或製作拿鐵奶泡！",
        image_url: "https://images.unsplash.com/photo-1550583724-b2692b85b150?w=500",
        expiry_date: now + (2 * ONE_DAY_MS),
        updated_at: new Date(now - 1000 * 60 * 15).toISOString()
      },
      {
        id: "item-2",
        nfc_uid: null,
        name: "手工起司切片盒",
        category: "食品生鮮",
        location: "廚房冰箱 - 冷藏庫",
        quantity: 1,
        notes: "已過期 1 天！請檢查是否有變質氣味再決定料理或丟棄。",
        image_url: "https://images.unsplash.com/photo-1486297678162-eb2a19b0a32d?w=500",

        updated_at: new Date(now - 1000 * 60 * 45).toISOString()
      },
      {
        id: "item-3",
        nfc_uid: null,
        name: "希臘式無糖優格 500g",
        category: "食品生鮮",
        location: "廚房冰箱 - 冷藏庫",
        quantity: 3,
        notes: "冷藏保存，適合搭配堅果與蜂蜜當早餐。",
        image_url: "https://images.unsplash.com/photo-1488477181946-6428a0291777?w=500",
        expiry_date: now + (5 * ONE_DAY_MS),
        updated_at: new Date(now - 1000 * 60 * 120).toISOString()
      },
      {
        id: "item-4",
        nfc_uid: null,
        name: "產銷履歷生鮮紅蛋 10入",
        category: "食品生鮮",
        location: "廚房冰箱 - 冷藏庫",
        quantity: 1,
        notes: "新鮮全蛋，請避免水洗，直接放置蛋架保存。",
        image_url: "https://images.unsplash.com/photo-1516467508483-a7212febe31a?w=500",
        expiry_date: now + (14 * ONE_DAY_MS),
        updated_at: new Date(now - 1000 * 60 * 180).toISOString()
      },

      // 電子防潮箱
      {
        id: "item-5",
        nfc_uid: null,
        name: "電子元件零件盒 A",
        category: "電子元件",
        location: "工作室 A 區電子防潮箱",
        quantity: 48,
        notes: "ESP8266 NodeMCU x4、ESP32-WROOM x3、RC522 NFC 讀卡模組 x6、杜邦線數包",
        image_url: "https://images.unsplash.com/photo-1518770660439-4636190af475?w=500",
        expiry_date: null,
        updated_at: new Date(now - 1000 * 60 * 60 * 2).toISOString()
      },
      {
        id: "item-6",
        nfc_uid: null,
        name: "0.96吋 I2C OLED 螢幕模組",
        category: "電子元件",
        location: "工作室 A 區電子防潮箱",
        quantity: 8,
        notes: "搭配微控制器顯示即時倉庫出入庫狀態與物料名稱",
        image_url: "https://images.unsplash.com/photo-1555664424-778a1e5e1b48?w=500",
        expiry_date: null,
        updated_at: new Date(now - 1000 * 60 * 60 * 3).toISOString()
      },

      // 工具箱
      {
        id: "item-7",
        nfc_uid: null,
        name: "居家修繕五金工具箱",
        category: "五金工具",
        location: "儲藏室五金工具箱",
        quantity: 16,
        notes: "BOSCH 衝擊電鑽、起子頭 32 件組、水平尺、3M 絕緣膠帶、不鏽鋼活動扳手",
        image_url: "https://images.unsplash.com/photo-1581783342308-f792dbdd27c5?w=500",
        expiry_date: null,
        updated_at: new Date(now - 1000 * 60 * 60 * 12).toISOString()
      },

      // 衣物箱
      {
        id: "item-8",
        nfc_uid: null,
        name: "換季厚重羽絨外套箱",
        category: "季節衣物",
        location: "主臥室換季衣物箱",
        quantity: 6,
        notes: "The North Face 羽絨外套 x2、發熱衣 x5、羊毛圍巾 x3（已放防潮芳香包）",
        image_url: "https://images.unsplash.com/photo-1544441893-675973e31985?w=500",
        expiry_date: null,
        updated_at: new Date(now - 1000 * 60 * 60 * 24).toISOString()
      },

      // 野營箱
      {
        id: "item-9",
        nfc_uid: null,
        name: "露營野炊裝備組 #1",
        category: "生活雜物",
        location: "車庫野營野炊裝備箱",
        quantity: 12,
        notes: "SOTO 蜘蛛爐、Snow Peak 鈦金屬雙層杯 x4、壓鑄鋁熱壓吐司夾、調味料收納袋、營燈",
        image_url: "https://images.unsplash.com/photo-1504280390367-361c6d9f38f4?w=500",
        expiry_date: null,
        updated_at: new Date(now - 1000 * 60 * 60 * 48).toISOString()
      },

      // 保險箱
      {
        id: "item-10",
        nfc_uid: null,
        name: "重要證件與房屋合約文件盒",
        category: "文件檔案",
        location: "書房防潮保險箱",
        quantity: 1,
        notes: "房屋權狀副本、歷年報稅所得證明、保單契約、護照備份影本",
        image_url: "https://images.unsplash.com/photo-1450133064473-71024230f91b?w=500",
        expiry_date: null,
        updated_at: new Date(now - 1000 * 60 * 60 * 72).toISOString()
      }
    ];

    // Helper to calculate expiry status
    function getExpiryInfo(expiryDate) {
      if (!expiryDate) return { status: 'none', days: null, label: '' };
      const diffDays = Math.ceil((expiryDate - Date.now()) / ONE_DAY_MS);
      const dateStr = new Date(expiryDate).toLocaleDateString('zh-TW');
      if (diffDays < 0) {
        return { status: 'expired', days: diffDays, label: `⚠️ 已過期 ${-diffDays} 天 (${dateStr})` };
      } else if (diffDays <= 7) {
        return { status: 'expiring_soon', days: diffDays, label: `⏳ 剩餘 ${diffDays} 天到期 (${dateStr})` };
      } else {
        return { status: 'fresh', days: diffDays, label: `🟢 效期至 ${dateStr} (剩 ${diffDays} 天)` };
      }
    }

    // --- 主程式 App ---
    function App() {
      // 狀態管理
      const [warehouses, setWarehouses] = useState(() => {
        const saved = localStorage.getItem('nfc_inventory_warehouses');
        return saved ? JSON.parse(saved) : INITIAL_WAREHOUSES;
      });

      const [items, setItems] = useState(() => {
        const saved = localStorage.getItem('nfc_inventory_items');
        return saved ? JSON.parse(saved) : INITIAL_ITEMS;
      });

      const [currentTab, setCurrentTab] = useState(0); // 0: 物品總清單, 1: 倉庫與收納箱
      const [searchQuery, setSearchQuery] = useState("");
      const [selectedCategory, setSelectedCategory] = useState("全部");
      const [filterOnlyExpiryAlert, setFilterOnlyExpiryAlert] = useState(false);
      const [isCompactView, setIsCompactView] = useState(false);

      // 互動彈窗狀態
      const [activeWarehouse, setActiveWarehouse] = useState(null); // 當前打開的倉庫看板
      const [isScanningNFC, setIsScanningNFC] = useState(false);
      const [showSimulator, setShowSimulator] = useState(false);
      const [showBackupModal, setShowBackupModal] = useState(false);
      const [showCreateWarehouseModal, setShowCreateWarehouseModal] = useState(false);
      const [createWarehouseUid, setCreateWarehouseUid] = useState(null);
      
      const [editingItem, setEditingItem] = useState(null); // null: closed
      const [isCreatingNewItem, setIsCreatingNewItem] = useState(false);
      const [prefilledLoc, setPrefilledLoc] = useState("");
      const [prefilledUid, setPrefilledUid] = useState("");

      const [checkoutItem, setCheckoutItem] = useState(null);
      const [transferItem, setTransferItem] = useState(null);
      const [toastMsg, setToastMsg] = useState(null);

      // 保存至 localStorage
      useEffect(() => {
        localStorage.setItem('nfc_inventory_warehouses', JSON.stringify(warehouses));
      }, [warehouses]);

      useEffect(() => {
        localStorage.setItem('nfc_inventory_items', JSON.stringify(items));
      }, [items]);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3000);
      };

      // 統計數據
      const metrics = useMemo(() => {
        const totalItemsCount = items.length;
        const totalUnits = items.sum ? 0 : items.reduce((acc, i) => acc + (i.quantity || 0), 0);
        let expired = 0;
        let expiringSoon = 0;
        items.forEach(it => {
          const info = getExpiryInfo(it.expiry_date);
          if (info.status === 'expired') expired++;
          else if (info.status === 'expiring_soon') expiringSoon++;
        });
        return {
          totalBoxes: totalItemsCount,
          totalUnits,
          totalWarehouses: warehouses.length,
          expired,
          expiringSoon
        };
      }, [items, warehouses]);

      // 篩選後物品
      const filteredItems = useMemo(() => {
        return items.filter(it => {
          if (filterOnlyExpiryAlert) {
            const info = getExpiryInfo(it.expiry_date);
            if (info.status !== 'expired' && info.status !== 'expiring_soon') return false;
          }
          if (selectedCategory !== "全部" && it.category !== selectedCategory) return false;
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            const matchName = it.name?.toLowerCase().includes(q);
            const matchLoc = it.location?.toLowerCase().includes(q);
            const matchNotes = it.notes?.toLowerCase().includes(q);
            const matchUid = it.nfc_uid?.toLowerCase().includes(q);
            if (!matchName && !matchLoc && !matchNotes && !matchUid) return false;
          }
          return true;
        });
      }, [items, filterOnlyExpiryAlert, selectedCategory, searchQuery]);

      // 處理 NFC 感應事件 (實體 Web NFC 或 虛擬模擬感應)
      const handleNfcTagDetected = (uid) => {
        const cleanUid = uid.trim().toUpperCase();
        setIsScanningNFC(false);

        // 優先度 1: 是否綁定倉庫？
        const foundWarehouse = warehouses.find(w => w.nfc_uid && w.nfc_uid.toUpperCase() === cleanUid);
        if (foundWarehouse) {
          setActiveWarehouse(foundWarehouse);
          showToast(`📡 已感應倉庫貼紙：【${foundWarehouse.name}】！`);
          return;
        }

        // 優先度 2: 是否綁定特定物品？
        const foundItem = items.find(i => i.nfc_uid && i.nfc_uid.toUpperCase() === cleanUid);
        if (foundItem) {
          setEditingItem(foundItem);
          showToast(`已感應物品標籤：${foundItem.name}`);
          return;
        }

        // 優先度 3: 未綁定貼紙 -> 引導建立
        setCreateWarehouseUid(cleanUid);
        setShowCreateWarehouseModal(true);
        showToast(`發現新貼紙 (${cleanUid})，請選擇欲綁定的倉庫或物品`);
      };

      // 啟動 Web NFC (若瀏覽器支援)
      const startWebNfcScan = async () => {
        if ('NDEFReader' in window) {
          try {
            setIsScanningNFC(true);
            const ndef = new NDEFReader();
            await ndef.scan();
            showToast("請靠近 NFC 智慧貼紙...");
            ndef.onreading = (event) => {
              const serial = event.serialNumber;
              if (serial) {
                // Format serial as hex separated with colons if needed
                const formatted = serial.toUpperCase();
                handleNfcTagDetected(formatted);
              }
            };
          } catch (error) {
            console.error("NFC Error:", error);
            setIsScanningNFC(false);
            showToast("Web NFC 啟動失敗或權限受限，已開啟虛擬模擬面板");
            setShowSimulator(true);
          }
        } else {
          // 未支援 Web NFC (如電腦或一般瀏覽器)，直接打開模擬器
          setShowSimulator(true);
          showToast("瀏覽器未支援 Web NFC 硬體，已為您開啟虛擬感應模擬器！");
        }
      };

      // 物品 CRUD 操作
      const handleSaveItem = (itemData) => {
        const nowStr = new Date().toISOString();
        if (isCreatingNewItem) {
          const newItem = {
            ...itemData,
            id: 'item-' + Date.now(),
            updated_at: nowStr
          };
          setItems(prev => [newItem, ...prev]);
          showToast(`【入庫成功】已新增「${newItem.name}」`);
        } else {
          setItems(prev => prev.map(i => i.id === itemData.id ? { ...itemData, updated_at: nowStr } : i));
          showToast(`已更新「${itemData.name}」`);
        }
        setEditingItem(null);
        setIsCreatingNewItem(false);
      };

      const handleDeleteItem = (itemId) => {
        setItems(prev => prev.filter(i => i.id !== itemId));
        setEditingItem(null);
        showToast("已刪除該物品");
      };

      const handleAdjustQuantity = (itemId, delta) => {
        setItems(prev => prev.map(it => {
          if (it.id === itemId) {
            const newQty = Math.max(0, (it.quantity || 0) + delta);
            return { ...it, quantity: newQty, updated_at: new Date().toISOString() };
          }
          return it;
        }));
      };

      // 出庫確認
      const handleConfirmCheckout = (item, qty, reason) => {
        const timeStr = new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
        const log = `\n[出庫紀錄 ${timeStr}] 出庫 ${qty} 件` + (reason ? `（用途：${reason}）` : '');
        setItems(prev => prev.map(it => {
          if (it.id === item.id) {
            return {
              ...it,
              quantity: Math.max(0, (it.quantity || 0) - qty),
              notes: (it.notes || '') + log,
              updated_at: new Date().toISOString()
            };
          }
          return it;
        }));
        showToast(`【出庫成功】已領出 ${qty} 件「${item.name}」`);
        setCheckoutItem(null);
      };

      // 轉移確認
      const handleConfirmTransfer = (item, newLoc, note) => {
        const timeStr = new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
        const log = `\n[轉移紀錄 ${timeStr}] 從「${item.location}」轉移至「${newLoc}」` + (note ? `（${note}）` : '');
        setItems(prev => prev.map(it => {
          if (it.id === item.id) {
            return {
              ...it,
              location: newLoc,
              notes: (it.notes || '') + log,
              updated_at: new Date().toISOString()
            };
          }
          return it;
        }));
        showToast(`【轉移成功】已將「${item.name}」轉移至「${newLoc}」`);
        setTransferItem(null);
      };

      // 建立倉庫
      const handleCreateWarehouse = (whData) => {
        const newWh = {
          ...whData,
          id: 'wh-' + Date.now(),
          updated_at: new Date().toISOString()
        };
        setWarehouses(prev => [...prev, newWh]);
        setShowCreateWarehouseModal(false);
        setActiveWarehouse(newWh);
        showToast(`已建立倉庫「${newWh.name}」！`);
      };

      // 刪除倉庫與其中物品
      const handleDeleteWarehouse = (warehouseId) => {
        const wh = warehouses.find(w => w.id === warehouseId);
        if (!wh) return;
        const count = items.filter(i => i.location === wh.name).length;
        if (confirm(`確定要刪除倉庫「${wh.name}」嗎？\n該倉庫內目前存有的 ${count} 種物品也將一併刪除。`)) {
          setWarehouses(prev => prev.filter(w => w.id !== warehouseId));
          setItems(prev => prev.filter(i => i.location !== wh.name));
          if (activeWarehouse && activeWarehouse.id === warehouseId) {
            setActiveWarehouse(null);
          }
          showToast(`已成功刪除倉庫「${wh.name}」及其中所有物品！`);
        }
      };

      // 清空所有倉庫與示範物品
      const handleClearAllData = () => {
        if (confirm("確定要清空所有倉庫與示範物品資料嗎？\n清空後列表將變成空白，您仍可隨時點擊「🔄」重新載入示範資料。")) {
          setWarehouses([]);
          setItems([]);
          setActiveWarehouse(null);
          showToast("已清空所有倉庫與物品資料！");
        }
      };

      const handleResetData = () => {
        if (confirm("確定要重置為預設測試資料嗎？現有變更將被覆蓋。")) {
          setWarehouses(INITIAL_WAREHOUSES);
          setItems(INITIAL_ITEMS);
          showToast("已成功重置為預載資料！");
        }
      };

      return (
        <div className="max-w-4xl mx-auto px-4 py-6">
          {/* Toast 通知 */}
          {toastMsg && (
            <div className="fixed top-5 left-1/2 -translate-x-1/2 z-50 bg-cyan-400 text-slate-950 font-bold px-4 py-2.5 rounded-lg shadow-2xl flex items-center space-x-2 border border-cyan-300 transition-all animate-bounce">
              <span>🔔</span>
              <span>{toastMsg}</span>
            </div>
          )}

          {/* 頂部 Header & 儀表板 */}
          <div className="bg-slate-900 border border-slate-700/80 rounded-2xl p-5 mb-5 shadow-xl">
            <div className="flex items-center justify-between pb-4 border-b border-slate-800">
              <div className="flex items-center space-x-3">
                <div className="w-10 h-10 rounded-xl bg-cyan-400/10 border border-cyan-400/40 flex items-center justify-center text-xl text-cyan-400 font-bold">
                  📡
                </div>
                <div>
                  <h1 className="text-xl font-bold tracking-tight text-white flex items-center space-x-2">
                    <span>NFC Smart Inventory</span>
                    <span className="text-xs bg-cyan-400/15 text-cyan-400 px-2 py-0.5 rounded font-mono border border-cyan-400/30">v1.2</span>
                  </h1>
                  <p className="text-xs text-slate-400">NFC 智慧貼紙倉庫管理 ｜ 掃描即時出入庫</p>
                </div>
              </div>

              {/* 頂部快捷按鈕 */}
              <div className="flex items-center space-x-2">
                <button
                  onClick={() => setShowSimulator(true)}
                  className="px-3 py-1.5 rounded-lg bg-cyan-400/10 hover:bg-cyan-400/20 text-cyan-400 border border-cyan-400/30 text-xs font-semibold flex items-center space-x-1 transition"
                  title="開發者模擬面板"
                >
                  <span>🔨</span>
                  <span className="hidden sm:inline">虛擬感應模擬</span>
                </button>
                <button
                  onClick={() => setShowBackupModal(true)}
                  className="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold flex items-center space-x-1 border border-slate-700 transition"
                  title="資料匯出與備份"
                >
                  <span>💾</span>
                  <span className="hidden sm:inline">備份/匯入</span>
                </button>
                <button
                  onClick={handleResetData}
                  className="p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white text-xs border border-slate-700 transition"
                  title="重置為範例"
                >
                  🔄
                </button>
                <button
                  onClick={handleClearAllData}
                  className="p-1.5 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 hover:text-rose-300 text-xs border border-rose-500/30 transition"
                  title="清空所有示範倉庫與物品"
                >
                  🗑️
                </button>
              </div>
            </div>

            {/* 統計指標卡片 */}
            <div className="grid grid-cols-3 gap-3 my-4">
              <div className="bg-slate-950/60 border border-slate-800 rounded-xl p-3">
                <div className="text-xs text-slate-400">收納物品品項</div>
                <div className="text-xl font-black text-white mt-1">{metrics.totalBoxes} <span className="text-xs font-normal text-slate-400">種</span></div>
              </div>
              <div className="bg-slate-950/60 border border-slate-800 rounded-xl p-3">
                <div className="text-xs text-slate-400">總物品件數</div>
                <div className="text-xl font-black text-emerald-400 mt-1">{metrics.totalUnits} <span className="text-xs font-normal text-slate-400">件</span></div>
              </div>
              <div
                onClick={() => setFilterOnlyExpiryAlert(!filterOnlyExpiryAlert)}
                className={`border rounded-xl p-3 cursor-pointer transition ${
                  filterOnlyExpiryAlert
                    ? 'bg-rose-500/20 border-rose-500 ring-1 ring-rose-500'
                    : 'bg-slate-950/60 border-slate-800 hover:border-amber-400/50'
                }`}
              >
                <div className="flex items-center justify-between text-xs text-slate-400">
                  <span>效期警戒狀態</span>
                  <span>⚠️</span>
                </div>
                <div className="text-sm font-bold text-rose-400 mt-1 flex items-center space-x-1">
                  <span>{metrics.expired ? `過期 ${metrics.expired}` : '無過期'}</span>
                  <span className="text-xs text-amber-400 font-normal">({metrics.expiringSoon}即期)</span>
                </div>
              </div>
            </div>

            {/* 醒目 NFC 感應主按鈕 */}
            <button
              onClick={startWebNfcScan}
              className="w-full py-3.5 px-4 bg-cyan-400 hover:bg-cyan-300 text-slate-950 font-bold rounded-xl shadow-lg shadow-cyan-950/50 flex items-center justify-center space-x-2 transition transform active:scale-[0.99]"
            >
              <span className="text-xl">📡</span>
              <span className="text-base tracking-wide">感應 NFC 倉庫貼紙 (Scan Tag)</span>
            </button>
          </div>

          {/* 導覽分頁 (雙頁籤) */}
          <div className="flex border-b border-slate-800 mb-5">
            <button
              onClick={() => setCurrentTab(0)}
              className={`pb-3 px-4 text-sm font-bold transition flex items-center space-x-2 border-b-2 ${
                currentTab === 0
                  ? 'border-cyan-400 text-cyan-400'
                  : 'border-transparent text-slate-400 hover:text-slate-200'
              }`}
            >
              <span>📦 全部物品清單</span>
              <span className="text-xs px-2 py-0.5 rounded-full bg-slate-800 text-slate-300">{filteredItems.length}</span>
            </button>
            <button
              onClick={() => setCurrentTab(1)}
              className={`pb-3 px-4 text-sm font-bold transition flex items-center space-x-2 border-b-2 ${
                currentTab === 1
                  ? 'border-cyan-400 text-cyan-400'
                  : 'border-transparent text-slate-400 hover:text-slate-200'
              }`}
            >
              <span>🏬 倉庫與收納箱總覽</span>
              <span className="text-xs px-2 py-0.5 rounded-full bg-slate-800 text-slate-300">{warehouses.length}</span>
            </button>
          </div>

          {/* TAB 0: 物品清單檢視 */}
          {currentTab === 0 && (
            <div>
              {/* 過期過濾橫幅 */}
              {filterOnlyExpiryAlert && (
                <div className="bg-rose-500/15 border border-rose-500/40 rounded-xl px-4 py-2.5 mb-4 flex items-center justify-between text-xs text-rose-300 font-semibold">
                  <span className="flex items-center space-x-2">
                    <span>🚨</span>
                    <span>已套用效期過濾：僅顯示已過期與 7 天內即期品項</span>
                  </span>
                  <button onClick={() => setFilterOnlyExpiryAlert(false)} className="text-rose-400 underline hover:text-rose-200">
                    清除過濾
                  </button>
                </div>
              )}

              {/* 搜尋與模式切換 */}
              <div className="flex items-center space-x-2 mb-3">
                <div className="relative flex-1">
                  <span className="absolute left-3 top-2.5 text-slate-400">🔍</span>
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder="搜尋物品名稱、位置、備註、NFC UID..."
                    className="w-full pl-9 pr-8 py-2 bg-slate-900 border border-slate-700/80 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-cyan-400"
                  />
                  {searchQuery && (
                    <button
                      onClick={() => setSearchQuery("")}
                      className="absolute right-3 top-2 text-slate-400 hover:text-white"
                    >
                      ✕
                    </button>
                  )}
                </div>

                <button
                  onClick={() => setIsCompactView(!isCompactView)}
                  className="px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-cyan-400 text-sm font-semibold hover:bg-slate-800 transition"
                  title={isCompactView ? "切換為大卡片" : "切換為精簡清單"}
                >
                  {isCompactView ? "🖼️ 卡片" : "📋 精簡"}
                </button>
              </div>

              {/* 分類篩選膠囊 */}
              <div className="flex items-center space-x-2 overflow-x-auto no-scrollbar pb-3 mb-4">
                {["全部", "食品生鮮", "電子元件", "五金工具", "生活雜物", "季節衣物", "文件檔案"].map(cat => (
                  <button
                    key={cat}
                    onClick={() => { setSelectedCategory(cat); setFilterOnlyExpiryAlert(false); }}
                    className={`px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition border ${
                      selectedCategory === cat && !filterOnlyExpiryAlert
                        ? 'bg-cyan-400/20 text-cyan-400 border-cyan-400/60'
                        : 'bg-slate-900 text-slate-400 border-slate-800 hover:border-slate-700'
                    }`}
                  >
                    {cat}
                  </button>
                ))}
              </div>

              {/* 物品列表 */}
              {filteredItems.length === 0 ? (
                <div className="text-center py-16 bg-slate-900/40 rounded-2xl border border-slate-800">
                  <div className="text-4xl mb-3">📦</div>
                  <div className="text-sm font-bold text-slate-300">找不到符合條件的物品</div>
                  <div className="text-xs text-slate-500 mt-1">請嘗試修改關鍵字或點擊重置按鈕</div>
                </div>
              ) : isCompactView ? (
                // 精簡清單檢視
                <div className="space-y-2">
                  {filteredItems.map(item => (
                    <div
                      key={item.id}
                      className="bg-slate-900 border border-slate-800 hover:border-slate-700 rounded-xl p-3 flex items-center justify-between transition"
                    >
                      <div className="flex-1 cursor-pointer" onClick={() => setEditingItem(item)}>
                        <div className="flex items-center space-x-2">
                          <span className="font-bold text-sm text-white">{item.name}</span>
                          <span className="text-[10px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700">{item.category}</span>
                          {item.expiry_date && (
                            <span className={`text-[10px] px-1.5 py-0.5 rounded font-bold ${
                              getExpiryInfo(item.expiry_date).status === 'expired'
                                ? 'bg-rose-500/20 text-rose-400 border border-rose-500/40'
                                : getExpiryInfo(item.expiry_date).status === 'expiring_soon'
                                ? 'bg-amber-500/20 text-amber-400 border border-amber-500/40'
                                : 'bg-emerald-500/10 text-emerald-400'
                            }`}>
                              {getExpiryInfo(item.expiry_date).label.split(' ')[0]}
                            </span>
                          )}
                        </div>
                        <div className="text-xs text-slate-400 mt-1 flex items-center space-x-2">
                          <span>📍 {item.location}</span>
                          {item.nfc_uid && <span className="font-mono text-[10px] text-cyan-400">UID: {item.nfc_uid}</span>}
                        </div>
                      </div>

                      {/* 數量調節 */}
                      <div className="flex items-center space-x-2">
                        <button
                          onClick={() => handleAdjustQuantity(item.id, -1)}
                          className="w-7 h-7 rounded-lg bg-slate-800 hover:bg-slate-700 text-white flex items-center justify-center font-bold"
                        >
                          -
                        </button>
                        <span className="font-bold text-sm text-cyan-400 min-w-[24px] text-center">{item.quantity}</span>
                        <button
                          onClick={() => handleAdjustQuantity(item.id, 1)}
                          className="w-7 h-7 rounded-lg bg-cyan-400 hover:bg-cyan-300 text-slate-950 flex items-center justify-center font-bold"
                        >
                          +
                        </button>
                        <button
                          onClick={() => setCheckoutItem(item)}
                          className="px-2 py-1 text-xs rounded bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 ml-2"
                        >
                          出庫
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              ) : (
                // 卡片檢視
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  {filteredItems.map(item => {
                    const expiry = getExpiryInfo(item.expiry_date);
                    return (
                      <div
                        key={item.id}
                        className="bg-slate-900 border border-slate-800 hover:border-slate-700 rounded-2xl overflow-hidden shadow-lg transition flex flex-col justify-between"
                      >
                        <div>
                          {item.image_url && (
                            <div className="w-full h-36 bg-slate-950 relative overflow-hidden">
                              <img src={item.image_url} alt={item.name} className="w-full h-full object-cover" />
                              <span className="absolute top-2 right-2 text-xs bg-slate-950/80 backdrop-blur px-2 py-1 rounded-md text-cyan-400 border border-slate-700 font-semibold">
                                {item.category}
                              </span>
                            </div>
                          )}

                          <div className="p-4">
                            <div className="flex items-start justify-between">
                              <h3
                                onClick={() => setEditingItem(item)}
                                className="font-bold text-base text-white hover:text-cyan-400 cursor-pointer"
                              >
                                {item.name}
                              </h3>
                              {!item.image_url && (
                                <span className="text-xs bg-slate-800 text-slate-300 px-2 py-0.5 rounded border border-slate-700">
                                  {item.category}
                                </span>
                              )}
                            </div>

                            {/* 效期標記 */}
                            {item.expiry_date && (
                              <div className={`mt-2 text-xs px-2.5 py-1 rounded-md font-bold inline-block border ${
                                expiry.status === 'expired'
                                  ? 'bg-rose-500/15 text-rose-400 border-rose-500/40'
                                  : expiry.status === 'expiring_soon'
                                  ? 'bg-amber-500/15 text-amber-400 border-amber-500/40'
                                  : 'bg-emerald-500/15 text-emerald-400 border-emerald-500/30'
                              }`}>
                                {expiry.label}
                              </div>
                            )}

                            <div className="text-xs text-slate-400 mt-2 flex items-center space-x-1">
                              <span>📍</span>
                              <span className="truncate">{item.location}</span>
                            </div>

                            {item.nfc_uid && (
                              <div className="mt-1 text-[11px] font-mono text-cyan-400 flex items-center space-x-1">
                                <span>🏷️</span>
                                <span>{item.nfc_uid}</span>
                              </div>
                            )}

                            {item.notes && (
                              <p className="text-xs text-slate-400 mt-2 line-clamp-2 bg-slate-950/40 p-2 rounded-lg border border-slate-800/80">
                                {item.notes}
                              </p>
                            )}
                          </div>
                        </div>

                        {/* 卡片底座快捷按鈕列 */}
                        <div className="p-3 bg-slate-950/60 border-t border-slate-800/80 flex items-center justify-between">
                          <div className="flex items-center space-x-1.5">
                            <button
                              onClick={() => setCheckoutItem(item)}
                              className="px-2.5 py-1 text-xs bg-slate-800 hover:bg-slate-700 text-cyan-400 rounded-md border border-slate-700 font-semibold"
                            >
                              出庫
                            </button>
                            <button
                              onClick={() => setTransferItem(item)}
                              className="px-2.5 py-1 text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-md border border-slate-700 font-semibold"
                            >
                              轉移
                            </button>
                          </div>

                          <div className="flex items-center space-x-2">
                            <button
                              onClick={() => handleAdjustQuantity(item.id, -1)}
                              className="w-7 h-7 rounded-lg bg-slate-800 hover:bg-slate-700 text-white flex items-center justify-center font-bold text-sm"
                            >
                              -
                            </button>
                            <span className="font-bold text-sm text-white px-1">{item.quantity}</span>
                            <button
                              onClick={() => handleAdjustQuantity(item.id, 1)}
                              className="w-7 h-7 rounded-lg bg-cyan-400 hover:bg-cyan-300 text-slate-950 flex items-center justify-center font-bold text-sm"
                            >
                              +
                            </button>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          {/* TAB 1: 倉庫與收納箱總覽 */}
          {currentTab === 1 && (
            <div className="space-y-4">
              <div className="flex items-center justify-between bg-slate-900 border border-slate-800 rounded-xl p-4">
                <div>
                  <h3 className="font-bold text-sm text-white">📡 倉庫 NFC 貼紙管理</h3>
                  <p className="text-xs text-slate-400 mt-0.5">點擊倉庫卡片即可展開倉內所有收納物，並直接出入庫</p>
                </div>
                <button
                  onClick={() => { setCreateWarehouseUid(""); setShowCreateWarehouseModal(true); }}
                  className="px-3 py-2 bg-cyan-400 hover:bg-cyan-300 text-slate-950 text-xs font-bold rounded-lg shadow"
                >
                  ＋ 建立新倉庫貼紙
                </button>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                {warehouses.map(wh => {
                  const storedItems = items.filter(i => i.location === wh.name);
                  const totalUnits = storedItems.reduce((acc, i) => acc + (i.quantity || 0), 0);
                  const hasExpired = storedItems.some(i => getExpiryInfo(i.expiry_date).status === 'expired');

                  return (
                    <div
                      key={wh.id}
                      onClick={() => setActiveWarehouse(wh)}
                      className="bg-slate-900 border border-slate-800 hover:border-cyan-400/60 rounded-2xl p-4 cursor-pointer transition shadow-lg group relative"
                    >
                      {hasExpired && (
                        <span className="absolute top-3 right-3 text-[10px] bg-rose-500/20 text-rose-400 px-2 py-0.5 rounded-full font-bold border border-rose-500/40">
                          ⚠️ 內含過期品
                        </span>
                      )}

                      <div className="flex items-center space-x-3">
                        <div className="w-12 h-12 rounded-xl bg-slate-950 border border-slate-700/80 flex items-center justify-center text-2xl group-hover:scale-105 transition">
                          {wh.icon || '📦'}
                        </div>
                        <div>
                          <h4 className="font-bold text-base text-white group-hover:text-cyan-400 transition">{wh.name}</h4>
                          <div className="text-xs text-slate-400 mt-0.5">
                            共收納 <span className="text-cyan-400 font-bold">{storedItems.length}</span> 種品項 ({totalUnits} 件)
                          </div>
                        </div>
                      </div>

                      {wh.description && (
                        <p className="text-xs text-slate-400 mt-3 line-clamp-2 bg-slate-950/40 p-2 rounded-lg border border-slate-800">
                          {wh.description}
                        </p>
                      )}

                      <div className="mt-3 pt-3 border-t border-slate-800/80 flex items-center justify-between text-xs text-slate-400">
                        <span className="font-mono text-cyan-400">{wh.nfc_uid ? `🏷️ UID: ${wh.nfc_uid}` : '未綁定貼紙'}</span>
                        <div className="flex items-center space-x-2">
                          <button
                            onClick={(e) => {
                              e.stopPropagation();
                              handleDeleteWarehouse(wh.id);
                            }}
                            className="p-1 rounded text-slate-500 hover:text-rose-400 hover:bg-rose-500/10 transition"
                            title="刪除此倉庫"
                          >
                            🗑️
                          </button>
                          <span className="group-hover:translate-x-1 transition text-cyan-400 font-semibold">展開看板 →</span>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* 浮動快捷新增按鈕 */}
          <div className="fixed bottom-6 right-6 z-40 flex items-center space-x-3">
            <button
              onClick={() => {
                setIsCreatingNewItem(true);
                setPrefilledLoc(activeWarehouse ? activeWarehouse.name : "");
                setPrefilledUid("");
                setEditingItem({
                  name: "",
                  category: "食品生鮮",
                  location: activeWarehouse ? activeWarehouse.name : "廚房冰箱 - 冷藏庫",
                  quantity: 1,
                  notes: "",
                  image_url: "",
                  expiry_date: Date.now() + 7 * ONE_DAY_MS
                });
              }}
              className="py-3 px-5 bg-cyan-400 hover:bg-cyan-300 text-slate-950 font-black rounded-full shadow-2xl flex items-center space-x-2 transition transform hover:scale-105 active:scale-95 border-2 border-slate-900"
            >
              <span>＋</span>
              <span>新增物品/食材</span>
            </button>
          </div>

          {/* ===================== MODALS ===================== */}

          {/* 1. 核心看板：WarehouseHubSheet (掃描倉庫貼紙後打開的倉庫總看板) */}
          {activeWarehouse && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className="bg-slate-900 border border-slate-700 w-full max-w-2xl max-h-[90vh] rounded-t-3xl sm:rounded-2xl p-5 overflow-hidden flex flex-col shadow-2xl">
                {/* 倉庫看板頭部 */}
                <div className="flex items-start justify-between pb-4 border-b border-slate-800">
                  <div className="flex items-center space-x-3">
                    <span className="text-4xl">{activeWarehouse.icon || '📦'}</span>
                    <div>
                      <h2 className="text-xl font-black text-white">{activeWarehouse.name}</h2>
                      <div className="text-xs text-cyan-400 font-mono flex items-center space-x-2 mt-0.5">
                        <span>🏷️ NFC 貼紙: {activeWarehouse.nfc_uid || '未綁定'}</span>
                      </div>
                    </div>
                  </div>
                  <div className="flex items-center space-x-2">
                    <button
                      onClick={() => handleDeleteWarehouse(activeWarehouse.id)}
                      className="px-2.5 py-1 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 text-xs font-semibold flex items-center space-x-1 transition"
                      title="刪除此倉庫"
                    >
                      <span>🗑️</span>
                      <span>刪除倉庫</span>
                    </button>
                    <button onClick={() => setActiveWarehouse(null)} className="text-slate-400 hover:text-white text-xl p-1">✕</button>
                  </div>
                </div>

                {activeWarehouse.description && (
                  <p className="text-xs text-slate-400 mt-2 px-1">{activeWarehouse.description}</p>
                )}

                {/* 倉內統計條 */}
                {(() => {
                  const whItems = items.filter(i => i.location === activeWarehouse.name);
                  const totalQty = whItems.reduce((acc, i) => acc + (i.quantity || 0), 0);
                  const expired = whItems.filter(i => getExpiryInfo(i.expiry_date).status === 'expired').length;
                  const expiring = whItems.filter(i => getExpiryInfo(i.expiry_date).status === 'expiring_soon').length;

                  return (
                    <div className="my-3 grid grid-cols-3 gap-2 text-center text-xs">
                      <div className="bg-slate-950 p-2 rounded-lg border border-slate-800">
                        <div className="text-slate-400">收納項目</div>
                        <div className="text-base font-bold text-white mt-0.5">{whItems.length} 種</div>
                      </div>
                      <div className="bg-slate-950 p-2 rounded-lg border border-slate-800">
                        <div className="text-slate-400">總件數</div>
                        <div className="text-base font-bold text-emerald-400 mt-0.5">{totalQty} 件</div>
                      </div>
                      <div className="bg-slate-950 p-2 rounded-lg border border-slate-800">
                        <div className="text-slate-400">效期注意</div>
                        <div className="text-base font-bold text-rose-400 mt-0.5">
                          {expired ? `${expired}件過期` : (expiring ? `${expiring}件即期` : '正常')}
                        </div>
                      </div>
                    </div>
                  );
                })()}

                {/* 快速入庫此倉庫按鈕 */}
                <button
                  onClick={() => {
                    setIsCreatingNewItem(true);
                    setEditingItem({
                      name: "",
                      category: "食品生鮮",
                      location: activeWarehouse.name,
                      quantity: 1,
                      notes: "",
                      image_url: "",
                      expiry_date: Date.now() + 7 * ONE_DAY_MS
                    });
                  }}
                  className="w-full py-2.5 bg-cyan-400 hover:bg-cyan-300 text-slate-950 font-bold rounded-xl text-sm mb-3 flex items-center justify-center space-x-2 transition"
                >
                  <span>📥</span>
                  <span>放入新物品 / 快速入庫此倉庫</span>
                </button>

                {/* 倉內物品列表 */}
                <div className="flex-1 overflow-y-auto space-y-2 pr-1">
                  {items.filter(i => i.location === activeWarehouse.name).length === 0 ? (
                    <div className="text-center py-10 text-slate-500 text-xs">
                      此倉庫目前為空，點選上方按鈕開始入庫
                    </div>
                  ) : (
                    items.filter(i => i.location === activeWarehouse.name).map(it => {
                      const expiry = getExpiryInfo(it.expiry_date);
                      return (
                        <div
                          key={it.id}
                          className="bg-slate-950/80 border border-slate-800 rounded-xl p-3 flex items-center justify-between"
                        >
                          <div className="flex-1 cursor-pointer" onClick={() => setEditingItem(it)}>
                            <div className="font-bold text-sm text-white">{it.name}</div>
                            {it.expiry_date && (
                              <div className={`text-[11px] font-semibold mt-0.5 ${
                                expiry.status === 'expired' ? 'text-rose-400' : (expiry.status === 'expiring_soon' ? 'text-amber-400' : 'text-emerald-400')
                              }`}>
                                {expiry.label}
                              </div>
                            )}
                            {it.notes && <div className="text-[11px] text-slate-500 line-clamp-1 mt-0.5">{it.notes}</div>}
                          </div>

                          <div className="flex items-center space-x-2 ml-2">
                            <button
                              onClick={() => handleAdjustQuantity(it.id, -1)}
                              className="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-white font-bold flex items-center justify-center"
                              title="出庫 1 件"
                            >
                              -
                            </button>
                            <span className="font-black text-sm text-white min-w-[20px] text-center">{it.quantity}</span>
                            <button
                              onClick={() => handleAdjustQuantity(it.id, 1)}
                              className="w-8 h-8 rounded-lg bg-cyan-400 hover:bg-cyan-300 text-slate-950 font-bold flex items-center justify-center"
                              title="入庫 1 件"
                            >
                              +
                            </button>
                            <button
                              onClick={() => setCheckoutItem(it)}
                              className="text-xs px-2 py-1 bg-slate-800 hover:bg-slate-700 text-cyan-400 rounded border border-slate-700 ml-1"
                            >
                              出庫登記
                            </button>
                          </div>
                        </div>
                      );
                    })
                  )}
                </div>
              </div>
            </div>
          )}

          {/* 2. 出庫登記 Modal */}
          {checkoutItem && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 w-full max-w-md rounded-2xl p-5 shadow-2xl">
                <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                  <h3 className="font-bold text-base text-white">📦 物品出庫登記</h3>
                  <button onClick={() => setCheckoutItem(null)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <div className="my-4 bg-slate-950 p-3 rounded-xl border border-slate-800">
                  <div className="font-bold text-white text-sm">{checkoutItem.name}</div>
                  <div className="text-xs text-slate-400 mt-1">目前存放：{checkoutItem.location} ｜ 現存庫存：<span className="text-cyan-400 font-bold">{checkoutItem.quantity}</span> 件</div>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  const form = e.target;
                  const qty = parseInt(form.qty.value) || 1;
                  const reason = form.reason.value;
                  handleConfirmCheckout(checkoutItem, qty, reason);
                }}>
                  <div className="mb-3">
                    <label className="block text-xs font-semibold text-slate-300 mb-1">欲出庫數量 (最多 {checkoutItem.quantity} 件)</label>
                    <input
                      name="qty"
                      type="number"
                      min="1"
                      max={checkoutItem.quantity}
                      defaultValue="1"
                      className="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-white font-bold"
                    />
                  </div>

                  <div className="mb-4">
                    <label className="block text-xs font-semibold text-slate-300 mb-1">出庫用途備註 (選填)</label>
                    <input
                      name="reason"
                      type="text"
                      placeholder="例如：晚餐烹飪、製作甜點、損耗報廢"
                      className="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-sm text-white"
                    />
                  </div>

                  <div className="flex space-x-2">
                    <button type="button" onClick={() => setCheckoutItem(null)} className="flex-1 py-2 rounded-lg bg-slate-800 text-slate-300 text-xs font-bold">取消</button>
                    <button type="submit" className="flex-1 py-2 rounded-lg bg-cyan-400 hover:bg-cyan-300 text-slate-950 text-xs font-bold">確認出庫</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 3. 轉移倉庫 Modal */}
          {transferItem && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 w-full max-w-md rounded-2xl p-5 shadow-2xl">
                <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                  <h3 className="font-bold text-base text-white">🚚 轉移存放位置</h3>
                  <button onClick={() => setTransferItem(null)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <div className="my-4 bg-slate-950 p-3 rounded-xl border border-slate-800">
                  <div className="font-bold text-white text-sm">{transferItem.name}</div>
                  <div className="text-xs text-slate-400 mt-1">目前位置：{transferItem.location}</div>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  const form = e.target;
                  const newLoc = form.newLoc.value.trim();
                  const note = form.note.value;
                  if (!newLoc) return alert("請選擇或輸入新位置");
                  handleConfirmTransfer(transferItem, newLoc, note);
                }}>
                  <div className="mb-3">
                    <label className="block text-xs font-semibold text-slate-300 mb-1">選擇目標倉庫</label>
                    <div className="grid grid-cols-2 gap-1.5 mb-2">
                      {warehouses.map(w => (
                        <button
                          type="button"
                          key={w.id}
                          onClick={() => { document.getElementById('transfer_input').value = w.name; }}
                          className="text-left text-xs p-2 bg-slate-950 hover:bg-cyan-400/20 border border-slate-800 rounded-lg text-slate-300 truncate"
                        >
                          {w.icon} {w.name}
                        </button>
                      ))}
                    </div>
                    <input
                      id="transfer_input"
                      name="newLoc"
                      type="text"
                      placeholder="或直接手動輸入新存放位置..."
                      className="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-sm text-white"
                    />
                  </div>

                  <div className="mb-4">
                    <label className="block text-xs font-semibold text-slate-300 mb-1">轉移原因備註</label>
                    <input
                      name="note"
                      type="text"
                      placeholder="例如：備料集中、空間整理"
                      className="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-sm text-white"
                    />
                  </div>

                  <div className="flex space-x-2">
                    <button type="button" onClick={() => setTransferItem(null)} className="flex-1 py-2 rounded-lg bg-slate-800 text-slate-300 text-xs font-bold">取消</button>
                    <button type="submit" className="flex-1 py-2 rounded-lg bg-cyan-400 hover:bg-cyan-300 text-slate-950 text-xs font-bold">確認轉移</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 4. 虛擬感應模擬器 Panel */}
          {showSimulator && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-cyan-400/40 w-full max-w-lg rounded-2xl p-5 shadow-2xl">
                <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                  <div className="flex items-center space-x-2">
                    <span className="text-xl">🔨</span>
                    <h3 className="font-bold text-base text-white">虛擬 NFC 感應測試面板</h3>
                  </div>
                  <button onClick={() => setShowSimulator(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <p className="text-xs text-slate-400 my-3">
                  無實體 NFC 讀卡機時，點擊以下貼紙按鈕即可瞬間模擬感應，測試「展開倉庫收納物」、「過期警示」與「出入庫」流程：
                </p>

                <div className="space-y-2 max-h-72 overflow-y-auto pr-1">
                  {[
                    { uid: "04:D1:22:90", label: "🧊 廚房冰箱 - 冷藏庫 (4項生鮮食材/過期起司)", badge: "倉庫貼紙" },
                    { uid: "04:A2:3B:9C", label: "📦 工作室 A 區電子防潮箱 (ESP32/NFC模組)", badge: "倉庫貼紙" },
                    { uid: "04:B5:12:F1", label: "🧰 儲藏室五金工具箱 (電鑽/手工具)", badge: "倉庫貼紙" },
                    { uid: "04:78:E4:2A", label: "🧥 主臥室換季衣物箱 (羽絨衣)", badge: "倉庫貼紙" },
                    { uid: "04:C9:88:54", label: "⛺ 車庫野營野炊裝備箱 (蜘蛛爐)", badge: "倉庫貼紙" },
                    { uid: "04:FA:33:10", label: "🔐 書房防潮保險箱 (重要文件合約)", badge: "倉庫貼紙" },
                    { uid: "04:99:AA:BB", label: "全新空白未綁定貼紙 (測試綁定流程)", badge: "未綁定" }
                  ].map(p => (
                    <div
                      key={p.uid}
                      onClick={() => {
                        setShowSimulator(false);
                        handleNfcTagDetected(p.uid);
                      }}
                      className="bg-slate-950 p-2.5 rounded-xl border border-slate-800 hover:border-cyan-400/50 cursor-pointer flex items-center justify-between text-xs transition"
                    >
                      <div>
                        <div className="font-bold text-white">{p.label}</div>
                        <div className="font-mono text-[10px] text-cyan-400 mt-0.5">UID: {p.uid}</div>
                      </div>
                      <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${p.badge === '倉庫貼紙' ? 'bg-cyan-500/20 text-cyan-300' : 'bg-amber-500/20 text-amber-300'}`}>
                        {p.badge}
                      </span>
                    </div>
                  ))}
                </div>

                <div className="mt-4 pt-3 border-t border-slate-800 flex space-x-2">
                  <input
                    id="custom_sim_input"
                    type="text"
                    placeholder="或自訂任意 UID (例如 04:EE:11:22)"
                    className="flex-1 px-3 py-1.5 bg-slate-950 border border-slate-700 rounded-lg text-xs text-white"
                  />
                  <button
                    onClick={() => {
                      const val = document.getElementById('custom_sim_input').value;
                      if (val) {
                        setShowSimulator(false);
                        handleNfcTagDetected(val);
                      }
                    }}
                    className="px-3 py-1.5 bg-cyan-400 text-slate-950 font-bold text-xs rounded-lg"
                  >
                    模擬感應
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 5. 新增/編輯物品 Modal */}
          {editingItem && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 w-full max-w-lg max-h-[90vh] overflow-y-auto rounded-2xl p-5 shadow-2xl">
                <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                  <h3 className="font-bold text-base text-white">{isCreatingNewItem ? '📥 快速入庫 / 新增物品' : '✏️ 編輯物品詳細'}</h3>
                  <button onClick={() => setEditingItem(null)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  const form = e.target;
                  const itemData = {
                    ...editingItem,
                    name: form.name.value.trim(),
                    category: form.category.value,
                    location: form.location.value.trim(),
                    quantity: parseInt(form.quantity.value) || 1,
                    nfc_uid: form.nfc_uid.value.trim() || null,
                    notes: form.notes.value.trim(),
                    image_url: form.image_url.value.trim(),
                    expiry_date: form.has_expiry.checked ? new Date(form.expiry_date.value).getTime() : null
                  };
                  if (!itemData.name) return alert("請輸入物品名稱");
                  if (!itemData.location) return alert("請指定存放位置");
                  handleSaveItem(itemData);
                }} className="space-y-3 mt-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1">物品 / 食品名稱 *</label>
                    <input
                      name="name"
                      type="text"
                      defaultValue={editingItem.name}
                      required
                      placeholder="例如：特級全脂牛奶、起司盒、電鑽工具"
                      className="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-sm text-white"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1">分類標籤</label>
                      <select
                        name="category"
                        defaultValue={editingItem.category || "食品生鮮"}
                        className="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-sm text-white"
                      >
                        {["食品生鮮", "電子元件", "五金工具", "生活雜物", "季節衣物", "文件檔案"].map(c => (
                          <option key={c} value={c}>{c}</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1">存放數量</label>
                      <input
                        name="quantity"
                        type="number"
                        min="0"
                        defaultValue={editingItem.quantity || 1}
                        className="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-sm text-white font-bold"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1">實體存放位置 / 所屬倉庫 *</label>
                    <input
                      name="location"
                      type="text"
                      defaultValue={editingItem.location || "廚房冰箱 - 冷藏庫"}
                      required
                      placeholder="例如：廚房冰箱 - 冷藏庫、工作室 A 區電子防潮箱"
                      className="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-sm text-white"
                    />
                  </div>

                  {/* 保存期限設定 */}
                  <div className="bg-slate-950 p-3 rounded-xl border border-slate-800">
                    <div className="flex items-center justify-between">
                      <label className="text-xs font-bold text-white flex items-center space-x-2">
                        <input
                          id="has_expiry_checkbox"
                          name="has_expiry"
                          type="checkbox"
                          defaultChecked={editingItem.expiry_date != null || editingItem.category === '食品生鮮'}
                          onChange={(e) => {
                            const dateInput = document.getElementById('expiry_date_input');
                            if (dateInput) dateInput.disabled = !e.target.checked;
                          }}
                          className="rounded text-cyan-400 focus:ring-0"
                        />
                        <span>啟用保存期限追蹤 (食品/易腐耗材)</span>
                      </label>
                    </div>

                    <div className="mt-2 flex items-center space-x-2">
                      <input
                        id="expiry_date_input"
                        name="expiry_date"
                        type="date"
                        defaultValue={
                          editingItem.expiry_date
                            ? new Date(editingItem.expiry_date).toISOString().split('T')[0]
                            : new Date(Date.now() + 7 * ONE_DAY_MS).toISOString().split('T')[0]
                        }
                        className="flex-1 px-3 py-1.5 bg-slate-900 border border-slate-700 rounded-lg text-xs text-white"
                      />
                    </div>

                    {/* 快捷天數標籤 */}
                    <div className="flex flex-wrap gap-1 mt-2">
                      {[
                        { label: "+3天", days: 3 },
                        { label: "+7天", days: 7 },
                        { label: "+14天", days: 14 },
                        { label: "+30天", days: 30 },
                        { label: "+90天", days: 90 },
                        { label: "+1年", days: 365 },
                      ].map(p => (
                        <button
                          type="button"
                          key={p.label}
                          onClick={() => {
                            const target = new Date(Date.now() + p.days * ONE_DAY_MS).toISOString().split('T')[0];
                            document.getElementById('expiry_date_input').value = target;
                            document.getElementById('has_expiry_checkbox').checked = true;
                          }}
                          className="text-[10px] px-2 py-0.5 rounded bg-slate-900 text-cyan-400 border border-slate-800 hover:border-cyan-400/50"
                        >
                          {p.label}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1">綁定單品專屬 NFC UID (選填)</label>
                    <input
                      name="nfc_uid"
                      type="text"
                      defaultValue={editingItem.nfc_uid || ""}
                      placeholder="若貼紙貼在此單品上可填入 (如 04:A2:3B:9C)"
                      className="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-sm text-white font-mono"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1">物品照片網址 (選填)</label>
                    <input
                      name="image_url"
                      type="url"
                      defaultValue={editingItem.image_url || ""}
                      placeholder="https://..."
                      className="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-sm text-white"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1">備註說明 / 出入庫日誌</label>
                    <textarea
                      name="notes"
                      rows="3"
                      defaultValue={editingItem.notes || ""}
                      placeholder="詳細特徵、過敏原標籤或出入庫歷程..."
                      className="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-sm text-white"
                    ></textarea>
                  </div>

                  <div className="flex space-x-2 pt-2">
                    {!isCreatingNewItem && (
                      <button
                        type="button"
                        onClick={() => handleDeleteItem(editingItem.id)}
                        className="px-4 py-2 bg-rose-500/20 hover:bg-rose-500/30 text-rose-400 rounded-lg text-xs font-bold border border-rose-500/40"
                      >
                        刪除
                      </button>
                    )}
                    <button
                      type="button"
                      onClick={() => setEditingItem(null)}
                      className="flex-1 py-2 bg-slate-800 text-slate-300 rounded-lg text-xs font-bold"
                    >
                      取消
                    </button>
                    <button
                      type="submit"
                      className="flex-1 py-2 bg-cyan-400 hover:bg-cyan-300 text-slate-950 rounded-lg text-xs font-bold"
                    >
                      儲存入庫
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 6. 建立倉庫 Modal */}
          {showCreateWarehouseModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 w-full max-w-md rounded-2xl p-5 shadow-2xl">
                <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                  <h3 className="font-bold text-base text-white">🏷️ 建立並綁定新倉庫 / 收納箱貼紙</h3>
                  <button onClick={() => setShowCreateWarehouseModal(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  const form = e.target;
                  const name = form.w_name.value.trim();
                  const icon = form.w_icon.value;
                  const nfc_uid = form.w_uid.value.trim() || null;
                  const description = form.w_desc.value.trim();
                  if (!name) return alert("請輸入倉庫名稱");
                  handleCreateWarehouse({ name, icon, nfc_uid, description });
                }} className="space-y-3 mt-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1">倉庫 / 箱子名稱 *</label>
                    <input
                      name="w_name"
                      type="text"
                      required
                      placeholder="例如：主臥室防潮櫃、地下室工具箱"
                      className="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-sm text-white"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1">代表圖示</label>
                      <select name="w_icon" defaultValue="📦" className="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-sm text-white">
                        <option value="🧊">🧊 冰箱冷藏</option>
                        <option value="❄️">❄️ 冰箱冷凍</option>
                        <option value="🧰">🧰 五金工具</option>
                        <option value="📦">📦 一般收納紙箱</option>
                        <option value="🧥">🧥 衣物箱</option>
                        <option value="⛺">⛺ 露營戶外箱</option>
                        <option value="🔐">🔐 防潮保險箱</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1">NFC 貼紙 UID</label>
                      <input
                        name="w_uid"
                        type="text"
                        defaultValue={createWarehouseUid || ""}
                        placeholder="例如 04:D1:22:90"
                        className="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-sm text-white font-mono"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1">存放環境與用途說明</label>
                    <input
                      name="w_desc"
                      type="text"
                      placeholder="例如：低溫 2~4°C、防潮恆溫、常溫避光"
                      className="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-sm text-white"
                    />
                  </div>

                  <div className="flex space-x-2 pt-2">
                    <button type="button" onClick={() => setShowCreateWarehouseModal(false)} className="flex-1 py-2 bg-slate-800 text-slate-300 rounded-lg text-xs font-bold">取消</button>
                    <button type="submit" className="flex-1 py-2 bg-cyan-400 hover:bg-cyan-300 text-slate-950 rounded-lg text-xs font-bold">確認建立並綁定</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 7. 備份與 JSON 匯出匯入 Modal */}
          {showBackupModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 w-full max-w-lg rounded-2xl p-5 shadow-2xl">
                <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                  <h3 className="font-bold text-base text-white">💾 JSON 資料備份與還原</h3>
                  <button onClick={() => setShowBackupModal(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <div className="my-3">
                  <label className="block text-xs font-semibold text-slate-300 mb-1">備份 JSON 字串 (可直接複製保存或貼入還原)：</label>
                  <textarea
                    id="backup_json_area"
                    rows="8"
                    defaultValue={JSON.stringify({ warehouses, items }, null, 2)}
                    className="w-full p-3 bg-slate-950 border border-slate-700 rounded-xl text-xs font-mono text-cyan-400"
                  ></textarea>
                </div>

                <div className="flex space-x-2">
                  <button
                    onClick={() => {
                      const txt = document.getElementById('backup_json_area').value;
                      navigator.clipboard.writeText(txt);
                      showToast("已成功複製 JSON 備份到剪貼簿！");
                    }}
                    className="flex-1 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-xs font-bold border border-slate-700"
                  >
                    📋 複製到剪貼簿
                  </button>
                  <button
                    onClick={() => {
                      try {
                        const txt = document.getElementById('backup_json_area').value;
                        const parsed = JSON.parse(txt);
                        if (parsed.warehouses) setWarehouses(parsed.warehouses);
                        if (parsed.items) setItems(parsed.items);
                        showToast("已成功匯入還原資料！");
                        setShowBackupModal(false);
                      } catch (e) {
                        alert("JSON 格式解析失敗，請確認內容格式！");
                      }
                    }}
                    className="flex-1 py-2 bg-cyan-400 hover:bg-cyan-300 text-slate-950 rounded-lg text-xs font-bold"
                  >
                    📥 匯入此 JSON
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
