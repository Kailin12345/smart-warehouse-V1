<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧儲存庫與食品過期管理系統</title>
    
    <!-- 引入外部輕量 AI 庫 (TensorFlow.js 與 MobileNet) -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>
    <!-- 引入商品條碼掃描庫 -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #eef2f5; margin: 0; padding: 15px; color: #333; }
        .container { max-width: 550px; margin: 0 auto; background: white; padding: 20px; border-radius: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h1 { font-size: 20px; color: #2c3e50; text-align: center; margin-bottom: 10px; }
        
        /* 使用者登入列樣式 */
        .user-bar { background: #e8f4fd; border: 1px solid #bbe1fa; padding: 10px 15px; border-radius: 8px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .user-bar span { font-weight: bold; color: #2980b9; }
        .switch-user-btn { background: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; margin-top: 0; width: auto; }

        /* 登入遮罩畫面 */
        #loginModal { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            background: rgba(0,0,0,0.7); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            z-index: 999999; 
        }
        .login-card { 
            background: white; 
            padding: 25px; 
            border-radius: 12px; 
            width: 90%; 
            max-width: 360px; 
            box-shadow: 0 5px 25px rgba(0,0,0,0.3); 
            max-height: 90vh;
            overflow-y: auto;
        }
        .login-card h2 { margin-top: 0; font-size: 18px; color: #2c3e50; text-align: center; }
        
        .user-btn-item {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            margin-top: 6px;
            cursor: pointer;
            text-align: center;
        }

        .card { background: #fafafa; border: 1px solid #e1e8ed; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        .card h3 { margin-top: 0; font-size: 15px; color: #34495e; border-bottom: 2px solid #ebedf0; padding-bottom: 8px; }
        label { display: block; margin-top: 10px; font-weight: 600; font-size: 13px; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        button { background: #3498db; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-size: 15px; font-weight: bold; margin-top: 15px; cursor: pointer; }
        .ai-btn { background: #e67e22; }
        .barcode-btn { background: #8e44ad; }
        .add-btn { background: #2980b9; margin-top: 5px; }
        .submit-btn { background: #27ae60; }
        .transfer-btn { background: #8e44ad; margin-top: 5px; }
        
        .action-btns { display: flex; gap: 5px; margin-top: 5px; }
        .out-btn { background: #e67e22; padding: 5px 10px; font-size: 12px; margin-top: 0; width: auto; }
        .delete-btn { background: #e74c3c; padding: 5px 10px; font-size: 12px; margin-top: 0; width: auto; }

        #reader { width: 100%; margin-top: 10px; }
        #preview { width: 100%; max-height: 200px; object-fit: contain; margin-top: 10px; display: none; border-radius: 6px; }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 10px; background: #bdc3c7; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; margin-top: 0; }
        .tab-btn.active { background: #2c3e50; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .inventory-item { background: white; border: 1px solid #ddd; padding: 10px; border-radius: 8px; margin-top: 10px; display: flex; align-items: center; gap: 10px; }
        .inventory-item img { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; }
        .inventory-info { flex-grow: 1; font-size: 13px; line-height: 1.4; }
    </style>
</head>
<body>

    <!-- 登入與創建使用者彈跳視窗 -->
    <div id="loginModal">
        <div class="login-card">
            <h2>👤 選擇帳號或新增使用者</h2>
            
            <label>1. 點擊現有帳號快速登入:</label>
            <div id="userListContainer" style="margin-top: 5px; max-height: 150px; overflow-y: auto;"></div>
            
            <hr style="margin: 15px 0; border: 0; border-top: 1px solid #ddd;">
            
            <label>2. 或是直接新增全新使用者:</label>
            <input type="text" id="newUsernameInput" placeholder="輸入新使用者名稱 (例如: 媽媽)">
            <label style="margin-top: 8px;">設定密碼:</label>
            <input type="password" id="newPasswordInput" placeholder="輸入登入密碼">
            <button type="button" onclick="createNewUser()" class="add-btn" style="background: #27ae60; margin-top: 10px;">➕ 註冊新帳號並登入</button>
        </div>
    </div>

<div class="container">
    <h1>📦 智慧儲存庫與食品管理</h1>

    <div class="user-bar">
        <div>當前使用者: <span id="currentUserNameDisplay">載入中...</span></div>
        <button class="switch-user-btn" onclick="showLoginModal()">切換 / 新增使用者</button>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('formTab', this)">📝 物品入庫</button>
        <button class="tab-btn" onclick="switchTab('listTab', this)">📋 現有庫存清單</button>
    </div>

    <!-- 頁籤一：物品入庫表單 -->
    <div id="formTab" class="tab-content active">
        <form id="itemForm" onsubmit="saveItem(event)">
            <div class="card">
                <h3>1. 儲存庫與儲位管理</h3>
                <label>選擇儲存庫:</label>
                <select id="storageSelect" required></select>

                <label>新增自訂儲存庫:</label>
                <input type="text" id="newStorageName" placeholder="例如: 💊 藥品急救箱">
                <button type="button" class="add-btn" onclick="addNewStorage()">➕ 建立新儲存庫</button>

                <hr style="margin: 15px 0; border: 0; border-top: 1px dashed #ccc;">
                <label>🔄 將「整個倉庫」的物品轉移到其他倉庫:</label>
                <div style="display: flex; gap: 5px; margin-top: 5px;">
                    <select id="targetTransferStorage" style="margin-top: 0;"></select>
                    <button type="button" class="transfer-btn" onclick="transferWholeStorage()" style="margin-top: 0; width: auto; white-space: nowrap;">執行轉移</button>
                </div>

                <label style="margin-top: 15px;">儲位編號 (NFC 自動帶入或手動):</label>
                <input type="text" id="locationInput" placeholder="例如: 抽屜-A1">
            </div>

            <div class="card">
                <h3>2. 物品辨識與拍照</h3>
                <button type="button" class="barcode-btn" onclick="startScanner()">📷 掃描商品條碼</button>
                <div id="reader"></div>

                <label>條碼編號:</label>
                <input type="text" id="barcodeInput" placeholder="掃描後自動填入">

                <label>拍攝物品照片:</label>
                <input type="file" id="photoInput" accept="image/*" capture="environment" onchange="previewImage(event)">
                <img id="preview" alt="預覽圖">

                <button type="button" class="ai-btn" onclick="runMobileAI()">✨ 執行手機本地 AI 分析</button>
            </div>

            <div class="card">
                <h3>3. 詳細資訊與過期日</h3>
                <label>物品名稱:</label>
                <input type="text" id="itemName" placeholder="輸入名稱或由 AI 帶入" required>

                <label>有效期限 (食品適用):</label>
                <input type="date" id="expiryDate">

                <label>數量:</label>
                <input type="number" id="itemQty" value="1" min="1" required>

                <button type="submit" class="submit-btn">💾 儲存至本地資料庫 (入庫)</button>
            </div>
        </form>
    </div>

    <!-- 頁籤二：現有庫存與出庫管理 -->
    <div id="listTab" class="tab-content">
        <div class="card">
            <h3>📋 目前所有庫存、有效期限與出庫</h3>
            <div id="inventoryList">載入中...</div>
        </div>
    </div>
</div>

<script>
    let aiModel = undefined;
    let base64Photo = "";
    let currentUser = "";

    const defaultStorages = [
        { id: "wardrobe", name: "🧥 臥室衣櫃" },
        { id: "toolbox", name: "🔧 工具箱" },
        { id: "pantry", name: "🍫 零食雜物櫃" }
    ];

    window.onload = async function() {
        initAppUsers();
        try {
            aiModel = await mobilenet.load();
            console.log("✅ 本地 AI 模型載入完成");
        } catch(e) { console.log("AI 載入失敗"); }
    };

    function initAppUsers() {
        let users = JSON.parse(localStorage.getItem('app_users_secure')) || { "預設使用者": "1234" };
        localStorage.setItem('app_users_secure', JSON.stringify(users));

        let savedUser = localStorage.getItem('current_user');
        if (savedUser && users[savedUser]) {
            setCurrentUser(savedUser);
        } else {
            showLoginModal();
        }
    }

    function showLoginModal() {
        let usersObj = JSON.parse(localStorage.getItem('app_users_secure')) || {};
        let container = document.getElementById('userListContainer');
        container.innerHTML = '';
        
        Object.keys(usersObj).forEach(u => {
            let btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'user-btn-item';
            btn.textContent = `👤 快速登入: ${u}`;
            btn.onclick = function() {
                let pwd = prompt(`請輸入「${u}」的密碼:`);
                if (pwd === null) return;
                if (usersObj[u] === pwd) {
                    setCurrentUser(u);
                    document.getElementById('loginModal').style.display = 'none';
                } else {
                    alert("❌ 密碼錯誤！");
                }
            };
            container.appendChild(btn);
        });
        
        document.getElementById('loginModal').style.display = 'flex';
    }

    function createNewUser() {
        let name = document.getElementById('newUsernameInput').value.trim();
        let password = document.getElementById('newPasswordInput').value;
        
        if (!name) { alert("請輸入新使用者名稱"); return; }
        if (!password) { alert("請設定密碼"); return; }
        
        let usersObj = JSON.parse(localStorage.getItem('app_users_secure')) || {};
        if (usersObj[name]) {
            let directLogin = confirm(`此使用者名稱「${name}」已經存在！要直接輸入密碼登入嗎？`);
            if (directLogin) {
                let pwd = prompt(`請輸入「${name}」的密碼:`);
                if (usersObj[name] === pwd) {
                    setCurrentUser(name);
                    document.getElementById('loginModal').style.display = 'none';
                } else {
                    alert("❌ 密碼錯誤！");
                }
            }
            return;
        }

        usersObj[name] = password;
        localStorage.setItem('app_users_secure', JSON.stringify(usersObj));
        
        document.getElementById('newUsernameInput').value = '';
        document.getElementById('newPasswordInput').value = '';
        
        setCurrentUser(name);
        document.getElementById('loginModal').style.display = 'none';
        alert(`✨ 成功註冊並登入使用者: ${name}`);
    }

    function setCurrentUser(username) {
        currentUser = username;
        localStorage.setItem('current_user', username);
        document.getElementById('currentUserNameDisplay').textContent = username;

        if (!localStorage.getItem(`storages_${username}`)) {
            localStorage.setItem(`storages_${username}`, JSON.stringify(defaultStorages));
        }
        if (!localStorage.getItem(`items_${username}`)) {
            localStorage.setItem(`items_${username}`, JSON.stringify([]));
        }

        loadStorages();
        renderInventory();

        const urlParams = new URLSearchParams(window.location.search);
        const targetStorage = urlParams.get('storage'); 
        const targetLoc = urlParams.get('loc');         

        if (targetStorage) {
            setTimeout(() => {
                document.getElementById('storageSelect').value = targetStorage;
            }, 200);
        }
        if (targetLoc) {
            document.getElementById('locationInput').value = targetLoc;
        }
    }

    function switchTab(tabId, btn) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');
        if(tabId === 'listTab') renderInventory();
    }

    function loadStorages() {
        let storages = JSON.parse(localStorage.getItem(`storages_${currentUser}`)) || defaultStorages;
        let select = document.getElementById('storageSelect');
        let targetSelect = document.getElementById('targetTransferStorage');
        
        select.innerHTML = '';
        targetSelect.innerHTML = '';

        storages.forEach(s => {
            let opt1 = document.createElement('option');
            opt1.value = s.id;
            opt1.textContent = s.name;
            select.appendChild(opt1);

            let opt2 = document.createElement('option');
            opt2.value = s.id;
            opt2.textContent = s.name;
            targetSelect.appendChild(opt2);
        });
    }

    function addNewStorage() {
        let name = document.getElementById('newStorageName').value.trim();
        if (!name) { alert("請輸入名稱"); return; }
        let key = `storages_${currentUser}`;
        let storages = JSON.parse(localStorage.getItem(key)) || [];
        let newId = 'store_' + Date.now();
        storages.push({ id: newId, name: name });
        localStorage.setItem(key, JSON.stringify(storages));
        document.getElementById('newStorageName').value = '';
        loadStorages();
        document.getElementById('storageSelect').value = newId;
        alert("✨ 建立成功！");
    }

    function transferWholeStorage() {
        let sourceStorageId = document.getElementById('storageSelect').value;
        let targetStorageId = document.getElementById('targetTransferStorage').value;

        if (sourceStorageId === targetStorageId) {
            alert("來源倉庫與目標倉庫不能相同！");
            return;
        }

        let storages = JSON.parse(localStorage.getItem(`storages_${currentUser}`));
        let sourceObj = storages.find(s => s.id === sourceStorageId);
        let targetObj = storages.find(s => s.id === targetStorageId);

        if (!confirm(`確定要將「${sourceObj.name}」裡的所有物品全部轉移到「${targetObj.name}」嗎？`)) return;

        let itemsKey = `items_${currentUser}`;
        let items = JSON.parse(localStorage.getItem(itemsKey)) || [];

        let count = 0;
        items.forEach(item => {
            if (item.storageId === sourceStorageId) {
                item.storageId = targetStorageId; 
                count++;
            }
        });

        localStorage.setItem(itemsKey, JSON.stringify(items));
        alert(`✅ 成功轉移 ${count} 項物品到「${targetObj.name}」！`);
        renderInventory();
    }

    function startScanner() {
        const scanner = new Html5Qrcode("reader");
        scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 200 }, (text) => {
            document.getElementById('barcodeInput').value = text;
            alert("✅ 條碼讀取成功: " + text);
            scanner.stop();
        }).catch(err => alert("相機啟動失敗"));
    }

    function previewImage(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                base64Photo = e.target.result;
                let img = document.getElementById('preview');
                img.src = base64Photo;
                img.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }
    }

    async function runMobileAI() {
        let img = document.getElementById('preview');
        if (!img.src || img.style.display === 'none') { alert("請先拍照！"); return; }
        if (!aiModel) { alert("AI 模型載入中..."); return; }
        alert("AI 正在手機晶片上分析中...");
        let preds = await aiModel.classify(img);
        if (preds && preds.length > 0) {
            document.getElementById('itemName').value = preds[0].className;
            alert("✨ 辨識成功: " + preds[0].className);
        }
    }

    function saveItem(event) {
        event.preventDefault();
        let key = `items_${currentUser}`;
        let items = JSON.parse(localStorage.getItem(key)) || [];
        
        let newItem = {
            id: Date.now(),
            storageId: document.getElementById('storageSelect').value,
            location: document.getElementById('locationInput').value,
            barcode: document.getElementById('barcodeInput').value,
            name: document.getElementById('itemName').value,
            expiryDate: document.getElementById('expiryDate').value,
            qty: parseInt(document.getElementById('itemQty').value),
            photo: base64Photo
        };

        items.push(newItem);
        localStorage.setItem(key, JSON.stringify(items));

        alert("✅ 物品入庫成功！");
        document.getElementById('itemForm').reset();
        document.getElementById('preview').style.display = 'none';
        base64Photo = "";
        renderInventory();
    }

    function outItem(id) {
        let key = `items_${currentUser}`;
        let items = JSON.parse(localStorage.getItem(key)) || [];
        let item = items.find(i => i.id === id);
        if (!item) return;

        let outQtyStr = prompt(`「${item.name}」目前庫存數量為 ${item.qty}。\n請輸入要出庫（減少）的數量：`, "1");
        if (outQtyStr === null) return;
        let outQty = parseInt(outQtyStr);

        if (isNaN(outQty) || outQty <= 0) {
            alert("請輸入有效的正整數！");
            return;
        }

        if (outQty >= item.qty) {
            if (confirm(`出庫數量大於或等於現有庫存，是否直接將此物品從清單中移除？`)) {
                items = items.filter(i => i.id !== id);
            } else {
                return;
            }
        } else {
            item.qty -= outQty;
            alert(`✅ 出庫成功！「${item.name}」剩餘數量：${item.qty}`);
        }

        localStorage.setItem(key, JSON.stringify(items));
        renderInventory();
    }

    function renderInventory() {
        let items = JSON.parse(localStorage.getItem(`items_${currentUser}`)) || [];
        let storages = JSON.parse(localStorage.getItem(`storages_${currentUser}`)) || defaultStorages;
        let container = document.getElementById('inventoryList');

        if (items.length === 0) {
            container.innerHTML = '<p style="text-align:center; color:#888;">目前沒有任何庫存資料</p>';
            return;
        }

        container.innerHTML = '';
        items.forEach(item => {
            let storageObj = storages.find(s => s.id === item.storageId);
            let storageName = storageObj ? storageObj.name : '未知分類';

            let div = document.createElement('div');
            div.className = 'inventory-item';
            div.innerHTML = `
                <img src="${item.photo || 'https://via.placeholder.com/50'}" alt="照片">
                <div class="inventory-info">
                    <strong>${item.name}</strong> (數量: <strong>${item.qty}</strong>)<br>
                    📍 位置: ${storageName} ${item.location ? '/ ' + item.location : ''}<br>
                    ⏳ 有效期限: ${item.expiryDate || '無'}
                </div>
                <div class="action-btns">
                    <button class="out-btn" onclick="outItem(${item.id})">➖ 出庫</button>
                    <button class="delete-btn" onclick="deleteItem(${item.id})">刪除</button>
                </div>
            `;
            container.appendChild(div);
        });
    }

    function deleteItem(id) {
        if (!confirm("確定要徹底刪除此筆記錄嗎？")) return;
        let key = `items_${currentUser}`;
        let items = JSON.parse(localStorage.getItem(key)) || [];
        items = items.filter(i => i.id !== id);
        localStorage.setItem(key, JSON.stringify(items));
        renderInventory();
    }
</script>
</body>
</html>
