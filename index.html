    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, errorMessage: "" };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, errorMessage: error?.message || String(error) };
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-[#090D16] text-slate-100 flex items-center justify-center p-6">
              <div className="bg-slate-900 border border-rose-500/50 rounded-2xl p-6 max-w-md w-full text-center space-y-4 shadow-2xl">

                <p className="text-xs text-rose-300 font-mono bg-slate-950 p-3 rounded-lg border border-slate-800 break-all">
                  {this.state.errorMessage}
                </p>
                <div className="flex space-x-2">
                  <button
                    onClick={() => this.setState({ hasError: false, errorMessage: "" })}
                    className="flex-1 py-2.5 bg-cyan-400 text-slate-950 font-bold rounded-xl text-xs"
                  >

    // Helper to calculate expiry status
    function getExpiryInfo(expiryDate) {
      if (expiryDate === null || expiryDate === undefined || expiryDate === '') {
        return { status: 'none', days: null, label: '' };
      }
      const ts = Number(expiryDate);
      if (Number.isNaN(ts)) {
        return { status: 'none', days: null, label: '' };
      }
      const diffDays = Math.ceil((ts - Date.now()) / ONE_DAY_MS);
      const dateStr = new Date(ts).toLocaleDateString('zh-TW');
      if (diffDays < 0) {
        return { status: 'expired', days: diffDays, label: `⚠️ 已過期 ${-diffDays} 天 (${dateStr})` };
      } else if (diffDays <= 7) {
        return { status: 'expiring_soon', days: diffDays, label: `⏳ 剩餘 ${diffDays} 天到期 (${dateStr})` };
      } else {
        return { status: 'fresh', days: diffDays, label: `🟢 效期至 ${dateStr} (剩 ${diffDays} 天)` };
      }
    }

    // --- 商品條碼掃描組件 (支援相機 BarcodeDetector + 手動 / 模擬輸入) ---
    function BarcodeScannerModal({ isOpen, title, onClose, onDetected }) {
      const videoRef = useRef(null);
      const streamRef = useRef(null);
      const timerRef = useRef(null);
      const [manualBarcode, setManualBarcode] = useState("");
      const [cameraError, setCameraError] = useState("");
      const [cameraActive, setCameraActive] = useState(false);

      const stopCamera = () => {
        if (timerRef.current) {
          clearInterval(timerRef.current);
          timerRef.current = null;
        }
        if (streamRef.current) {
          streamRef.current.getTracks().forEach(t => t.stop());
          streamRef.current = null;
        }
        setCameraActive(false);
      };

      useEffect(() => {
        if (!isOpen) {
          stopCamera();
          setManualBarcode("");
          setCameraError("");
          return;
        }

        let cancelled = false;
        const startCamera = async () => {
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            setCameraError("此瀏覽器環境不支援相機存取（需 HTTPS 或支援的手機瀏覽器），請改用下方條碼輸入或測試按鈕。");
            return;
          }
          try {
            const stream = await navigator.mediaDevices.getUserMedia({
              video: { facingMode: { ideal: "environment" } }
            });
            if (cancelled) {
              stream.getTracks().forEach(t => t.stop());
              return;
            }
            streamRef.current = stream;
            if (videoRef.current) {
              videoRef.current.srcObject = stream;
              await videoRef.current.play().catch(() => {});
            }
            setCameraActive(true);

            if ('BarcodeDetector' in window) {
              const detector = new window.BarcodeDetector({
                formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'qr_code']
              });
              timerRef.current = setInterval(async () => {
                if (!videoRef.current || videoRef.current.readyState < 2) return;
                try {
                  const codes = await detector.detect(videoRef.current);
                  if (codes && codes.length > 0 && codes[0].rawValue) {
                    const val = codes[0].rawValue.trim();
                    stopCamera();
                    onDetected(val);
                  }
                } catch (_) {}
              }, 350);
            } else {
              setCameraError("已開啟相機預覽，但此瀏覽器未內建 BarcodeDetector；您可直接在下方輸入或點選測試條碼。");
            }
          } catch (err) {
            setCameraError("無法開啟相機（請確認相機權限或改為手動輸入條碼）。");
          }
        };

        startCamera();
        return () => {
          cancelled = true;
          stopCamera();
        };
      }, [isOpen]);

      if (!isOpen) return null;

      return (
        <div className="fixed inset-0 z-[70] bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-cyan-400/50 w-full max-w-md rounded-2xl p-5 shadow-2xl space-y-4">
            <div className="flex items-center justify-between pb-3 border-b border-slate-800">
              <div className="flex items-center space-x-2">
                <span className="text-xl">📷</span>
                <h3 className="font-bold text-base text-white">{title || "掃描商品條碼"}</h3>
              </div>
              <button
                type="button"
                onClick={() => { stopCamera(); onClose(); }}
                className="text-slate-400 hover:text-white text-lg px-2"
              >
                ✕
              </button>
            </div>

            <div className="relative w-full h-48 bg-slate-950 rounded-xl overflow-hidden border border-slate-800 flex items-center justify-center">
              <video ref={videoRef} playsInline muted className="w-full h-full object-cover" />
              {cameraActive && (
                <div className="absolute inset-0 pointer-events-none flex items-center justify-center">
                  <div className="w-4/5 h-20 border-2 border-cyan-400 rounded-lg shadow-[0_0_15px_rgba(34,211,238,0.4)] flex items-center justify-center">
                    <div className="w-full h-0.5 bg-rose-400/80 animate-pulse"></div>
                  </div>
                </div>
              )}
              {!cameraActive && !cameraError && (
                <div className="text-xs text-slate-400">正在啟動相機鏡頭...</div>
              )}
            </div>

            {cameraError && (
              <div className="text-xs text-amber-300 bg-amber-500/10 border border-amber-500/30 rounded-lg p-2.5">
                {cameraError}
              </div>
            )}

            <form
              onSubmit={(e) => {
                e.preventDefault();
                if (manualBarcode.trim()) {
                  stopCamera();
                  onDetected(manualBarcode.trim());
                }
              }}
              className="space-y-2"
            >
              <label className="block text-xs font-semibold text-slate-300">手動輸入 / 外接條碼槍掃入：</label>
              <div className="flex space-x-2">
                <input
                  type="text"
                  value={manualBarcode}
                  onChange={(e) => setManualBarcode(e.target.value)}
                  placeholder="輸入 EAN-13 / UPC / QR 條碼..."
                  className="flex-1 px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-sm font-mono text-cyan-400 focus:border-cyan-400 focus:outline-none"
                />
                <button
                  type="submit"
                  className="px-4 py-2 bg-cyan-400 hover:bg-cyan-300 text-slate-950 font-bold text-xs rounded-lg"
                >
                  確認條碼
                </button>
              </div>
            </form>

            <div className="pt-2 border-t border-slate-800">
              <div className="text-[11px] text-slate-400 mb-2">快速模擬商品條碼：</div>
              <div className="flex flex-wrap gap-1.5">
                {[
                  { code: "4710088410123", label: "北海道鮮乳" },
                  { code: "4710105012345", label: "無糖優格" },
                  { code: "4902102999998", label: "全新品項測試條碼" }
                ].map(sample => (
                  <button
                    key={sample.code}
                    type="button"
                    onClick={() => { stopCamera(); onDetected(sample.code); }}
                    className="text-[11px] px-2.5 py-1 rounded-lg bg-slate-950 hover:border-cyan-400 border border-slate-800 text-slate-300 transition"
                  >
                    {sample.label} ({sample.code.slice(-4)})
                  </button>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

      }, [enableBarcodeInHub]);

      useEffect(() => {
        if (activeWarehouse) {
          setWarehouseHubTab('inventory');
          setWarehouseEditForm({
            name: activeWarehouse.name || "",
            nfc_uid: activeWarehouse.nfc_uid || "",
            icon: activeWarehouse.icon || "📦",
            description: activeWarehouse.description || ""
          });
          setTransferSearch("");
          setScannedBarcodeMatch(null);
        }
      }, [activeWarehouse?.id]);

      // 保存至 localStorage
      useEffect(() => {
        localStorage.setItem('nfc_inventory_warehouses', JSON.stringify(warehouses));
      }, [warehouses]);

      useEffect(() => {
        localStorage.setItem('nfc_inventory_items', JSON.stringify(items));
      }, [items]);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3000);
      };

      // 統計數據
      const metrics = useMemo(() => {
        const totalItemsCount = items.length;
        const totalUnits = items.sum ? 0 : items.reduce((acc, i) => acc + (i.quantity || 0), 0);
        let expired = 0;
        let expiringSoon = 0;
        items.forEach(it => {
          const info = getExpiryInfo(it.expiry_date);
          if (info.status === 'expired') expired++;
          else if (info.status === 'expiring_soon') expiringSoon++;
        });
        return {
          totalBoxes: totalItemsCount,
          totalUnits,
          totalWarehouses: warehouses.length,
          expired,
          expiringSoon
        };
      }, [items, warehouses]);

      // 篩選後物品
      const filteredItems = useMemo(() => {
        return items.filter(it => {
          if (filterOnlyExpiryAlert) {
            const info = getExpiryInfo(it.expiry_date);
            if (info.status !== 'expired' && info.status !== 'expiring_soon') return false;
          }
          if (selectedCategory !== "全部" && it.category !== selectedCategory) return false;
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            const matchName = it.name?.toLowerCase().includes(q);
            const matchLoc = it.location?.toLowerCase().includes(q);
            const matchNotes = it.notes?.toLowerCase().includes(q);
            const matchUid = it.nfc_uid?.toLowerCase().includes(q);
            const matchBarcode = it.barcode?.toLowerCase().includes(q);
            if (!matchName && !matchLoc && !matchNotes && !matchUid && !matchBarcode) return false;
          }
          return true;
        });
      }, [items, filterOnlyExpiryAlert, selectedCategory, searchQuery]);

      // 處理 NFC 感應事件 (實體 Web NFC 或 虛擬模擬感應)
      const handleNfcTagDetected = (uid) => {
        const cleanUid = (uid || "").trim().toUpperCase();
        if (!cleanUid) {
          showToast("⚠️ 無法讀取貼紙 UID，請改用虛擬模擬面板或手動輸入");
          setIsScanningNFC(false);
          return;
        }
        setIsScanningNFC(false);

        // 優先度 1: 是否綁定倉庫？
        const foundWarehouse = warehouses.find(w => w.nfc_uid && w.nfc_uid.toUpperCase() === cleanUid);
        if (foundWarehouse) {
          setActiveWarehouse(foundWarehouse);
          showToast(`📡 已感應倉庫貼紙：【${foundWarehouse.name}】！`);
          return;
        }

        // 優先度 2: 是否綁定特定物品？
        const foundItem = items.find(i => i.nfc_uid && i.nfc_uid.toUpperCase() === cleanUid);
        if (foundItem) {
          setIsCreatingNewItem(false);
          setEditingItem(foundItem);
          showToast(`已感應物品標籤：${foundItem.name}`);
          return;
        }

        // 優先度 3: 未綁定貼紙 -> 顯示完整操作選單（設定倉庫 / 綁定到現有倉庫 / 新增物品入庫）
        setUnboundUidChoice(cleanUid);
        showToast(`發現新貼紙 (${cleanUid})，請選擇要執行的動作`);
      };

      // 處理掃描到商品條碼
      const handleBarcodeScanned = (rawCode) => {
        const code = (rawCode || "").trim();
        const target = barcodeScannerTarget;
        setBarcodeScannerTarget(null);
        if (!code) return;

        if (target === 'edit_item') {
          const inputEl = document.getElementById('edit_item_barcode');
          if (inputEl) inputEl.value = code;
          setEditingItem(prev => prev ? { ...prev, barcode: code } : prev);
          showToast(`📷 已帶入商品條碼：${code}`);
          return;
        }

        if (target === 'hub_inbound') {
          const existingAny = items.find(i => i.barcode && i.barcode === code);
          setQuickInboundForm(prev => ({
            ...prev,
            barcode: code,
            name: prev.name || (existingAny ? existingAny.name : ""),
            category: existingAny ? existingAny.category : prev.category
          }));
          showToast(existingAny
            ? `📷 條碼匹配既有品項「${existingAny.name}」，已帶入表單`
            : `📷 已掃入商品條碼：${code}`);
          return;
        }

        if (target === 'hub_inventory' && activeWarehouse) {
          const inWh = items.find(i => i.location === activeWarehouse.name && i.barcode === code);
          if (inWh) {
            setScannedBarcodeMatch({ barcode: code, item: inWh, inActiveWarehouse: true });
            showToast(`📷 命中倉內品項：「${inWh.name}」`);
            return;
          }
          const elsewhere = items.find(i => i.barcode === code);
          if (elsewhere) {
            setScannedBarcodeMatch({ barcode: code, item: elsewhere, inActiveWarehouse: false });
            showToast(`📷 於「${elsewhere.location}」找到條碼品項`);
            return;
          }
          // 尚未建檔的新條碼 -> 引導帶入極速入庫
          setQuickInboundForm(prev => ({ ...prev, barcode: code }));
          setWarehouseHubTab('inbound');
          showToast(`📷 新商品條碼 ${code}，已為您切換至快速入庫並帶入條碼！`);
        }
      };

      // 啟動 Web NFC (若瀏覽器支援)
      const startWebNfcScan = async () => {
        if ('NDEFReader' in window) {
          try {
            setIsScanningNFC(true);
            const ndef = new NDEFReader();
            await ndef.scan();
            showToast("請將手機背部靠近 NFC 智慧貼紙...");
            ndef.onreading = (event) => {
              let detectedUid = (event.serialNumber || "").trim();
              if (!detectedUid && event.message && Array.isArray(event.message.records)) {
                for (const rec of event.message.records) {
                  if (rec.recordType === "text" && rec.data) {
                    try {
                      const decoder = new TextDecoder(rec.encoding || "utf-8");
                      const txt = decoder.decode(rec.data).trim();
                      if (txt) {
                        detectedUid = txt;
                        break;
                      }
                    } catch (_) {}
                  }
                }
              }
              if (detectedUid) {
                handleNfcTagDetected(detectedUid.toUpperCase());
              } else {
                setIsScanningNFC(false);
                setShowSimulator(true);
                showToast("此貼紙未提供序列號，請使用虛擬模擬或手動綁定");
              }
            };
            ndef.onreadingerror = () => {
              setIsScanningNFC(false);
              showToast("⚠️ NFC 讀取失敗，請重新貼近貼紙或開啟模擬面板");
            };
          } catch (error) {
            console.error("NFC Error:", error);
            setIsScanningNFC(false);
            showToast("Web NFC 啟動失敗或權限受限，已開啟虛擬模擬面板");
            setShowSimulator(true);
          }
        } else {
          // 未支援 Web NFC (如電腦或一般瀏覽器)，直接打開模擬器
          setShowSimulator(true);
          showToast("瀏覽器未支援 Web NFC 硬體，已為您開啟虛擬感應模擬器！");
        }
      };

      // 物品 CRUD 操作
      const handleSaveItem = (itemData) => {
        const nowStr = new Date().toISOString();
        if (isCreatingNewItem) {
          const newItem = {
            ...itemData,
            id: 'item-' + Date.now(),
            updated_at: nowStr
          };
          setItems(prev => [newItem, ...prev]);
          showToast(`【入庫成功】已新增「${newItem.name}」`);
        } else {
          setItems(prev => prev.map(i => i.id === itemData.id ? { ...itemData, updated_at: nowStr } : i));
          showToast(`已更新「${itemData.name}」`);
        }
        setEditingItem(null);
        setIsCreatingNewItem(false);
      };

      const handleDeleteItem = (itemId) => {
        setItems(prev => prev.filter(i => i.id !== itemId));
        setEditingItem(null);
        showToast("已刪除該物品");
      };

      const handleAdjustQuantity = (itemId, delta) => {
        setItems(prev => prev.map(it => {
          if (it.id === itemId) {
            const newQty = Math.max(0, (it.quantity || 0) + delta);
            return { ...it, quantity: newQty, updated_at: new Date().toISOString() };
          }
          return it;
        }));
      };

      // 出庫確認
      const handleConfirmCheckout = (item, qty, reason) => {
        const timeStr = new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
        const log = `\n[出庫紀錄 ${timeStr}] 出庫 ${qty} 件` + (reason ? `（用途：${reason}）` : '');
        setItems(prev => prev.map(it => {
          if (it.id === item.id) {
            return {
              ...it,
              quantity: Math.max(0, (it.quantity || 0) - qty),
              notes: (it.notes || '') + log,
              updated_at: new Date().toISOString()
            };
          }
          return it;
        }));
        showToast(`【出庫成功】已領出 ${qty} 件「${item.name}」`);
        setCheckoutItem(null);
      };

      // 轉移確認
      const handleConfirmTransfer = (item, newLoc, note) => {
        const timeStr = new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
        const log = `\n[轉移紀錄 ${timeStr}] 從「${item.location}」轉移至「${newLoc}」` + (note ? `（${note}）` : '');
        setItems(prev => prev.map(it => {
          if (it.id === item.id) {
            return {
              ...it,
              location: newLoc,
              notes: (it.notes || '') + log,
              updated_at: new Date().toISOString()
            };
          }
          return it;
        }));
        showToast(`【轉移成功】已將「${item.name}」轉移至「${newLoc}」`);
        setTransferItem(null);
      };

      // 建立倉庫
      const handleCreateWarehouse = (whData) => {
        const newWh = {
          ...whData,
          id: 'wh-' + Date.now(),
          updated_at: new Date().toISOString()
        };
        setWarehouses(prev => [...prev, newWh]);
        setShowCreateWarehouseModal(false);
        setActiveWarehouse(newWh);
        showToast(`已建立倉庫「${newWh.name}」！`);
      };

      // 更新倉庫設定（若更名會自動同步更新倉內物品位置）
      const handleUpdateWarehouseSettings = (e) => {
        e.preventDefault();
        if (!activeWarehouse || !warehouseEditForm.name.trim()) return;
        const oldName = activeWarehouse.name;
        const newName = warehouseEditForm.name.trim();
        const updatedWh = {
          ...activeWarehouse,
          name: newName,
          nfc_uid: warehouseEditForm.nfc_uid.trim().toUpperCase() || null,
          icon: warehouseEditForm.icon || "📦",
          description: warehouseEditForm.description.trim(),
          updated_at: new Date().toISOString()
        };
        setWarehouses(prev => prev.map(w => w.id === activeWarehouse.id ? updatedWh : w));
        if (oldName !== newName) {
          setItems(prev => prev.map(it => it.location === oldName ? { ...it, location: newName, updated_at: new Date().toISOString() } : it));
        }
        setActiveWarehouse(updatedWh);
        setWarehouseHubTab('inventory');
        showToast(`已更新倉庫「${updatedWh.name}」設定！`);
      };

      // 綁定新掃到的貼紙到現有倉庫並立即打開出入庫看板
      const handleBindTagToExistingWarehouse = (uid, wh) => {
        const cleanUid = uid.trim().toUpperCase();
        const updatedWh = { ...wh, nfc_uid: cleanUid, updated_at: new Date().toISOString() };
        setWarehouses(prev => prev.map(w => w.id === wh.id ? updatedWh : w));
        setUnboundUidChoice(null);
        setActiveWarehouse(updatedWh);
        showToast(`已將貼紙 (${cleanUid}) 綁定至「${updatedWh.name}」，可立即進行物品出入庫！`);
      };

      // 倉庫內極速入庫
      const handleQuickInboundToWarehouse = (e) => {
        e.preventDefault();
        if (!activeWarehouse || !quickInboundForm.name.trim()) return;
        const qty = Math.max(1, parseInt(quickInboundForm.quantity) || 1);
        const days = parseInt(quickInboundForm.expiryDays, 10);
        const expiryDate = quickInboundForm.hasExpiry && quickInboundForm.expiryDays !== "" && !Number.isNaN(days)
          ? Date.now() + days * ONE_DAY_MS
          : null;
        const newItem = {
          id: 'item-' + Date.now(),
          nfc_uid: null,
          barcode: enableBarcodeInHub && quickInboundForm.barcode ? quickInboundForm.barcode.trim() : "",
          name: quickInboundForm.name.trim(),
          category: quickInboundForm.category,
          location: activeWarehouse.name,
          quantity: qty,
          notes: quickInboundForm.notes.trim(),
          image_url: "",
          expiry_date: expiryDate,
          updated_at: new Date().toISOString()
        };
        setItems(prev => [newItem, ...prev]);
        setQuickInboundForm({ name: "", barcode: "", category: "食品生鮮", quantity: 1, hasExpiry: false, expiryDays: "7", notes: "" });
        setWarehouseHubTab('inventory');
        showToast(`【快速入庫】已將 ${qty} 件「${newItem.name}」放入「${activeWarehouse.name}」${expiryDate ? '' : '（無有效日期）'}`);
      };

      // 將其他倉庫物品一鍵調撥入庫到目前倉庫
      const handleTransferInToActiveWarehouse = (item) => {
        if (!activeWarehouse) return;
        const timeStr = new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
        const log = `\n[調撥入庫 ${timeStr}] 從「${item.location}」移入「${activeWarehouse.name}」`;
        setItems(prev => prev.map(it => it.id === item.id ? {
          ...it,
          location: activeWarehouse.name,
          notes: (it.notes || '') + log,
          updated_at: new Date().toISOString()
        } : it));
        setWarehouseHubTab('inventory');
        showToast(`【調撥入庫】已將「${item.name}」移入「${activeWarehouse.name}」`);
      };

      // 刪除倉庫與其中物品
      const handleDeleteWarehouse = (warehouseId) => {
        const wh = warehouses.find(w => w.id === warehouseId);
        if (!wh) return;
        const count = items.filter(i => i.location === wh.name).length;
        if (confirm(`確定要刪除倉庫「${wh.name}」嗎？\n該倉庫內目前存有的 ${count} 種物品也將一併刪除。`)) {
          setWarehouses(prev => prev.filter(w => w.id !== warehouseId));
          setItems(prev => prev.filter(i => i.location !== wh.name));
          if (activeWarehouse && activeWarehouse.id === warehouseId) {
            setActiveWarehouse(null);
          }
          showToast(`已成功刪除倉庫「${wh.name}」及其中所有物品！`);
        }
      };

      // 清空所有倉庫與示範物品
      const handleClearAllData = () => {
        if (confirm("確定要清空所有倉庫與示範物品資料嗎？\n清空後列表將變成空白，您仍可隨時點擊「🔄」重新載入示範資料。")) {
          setWarehouses([]);
          setItems([]);
          setActiveWarehouse(null);
          showToast("已清空所有倉庫與物品資料！");
        }
      };

      const handleResetData = () => {
        if (confirm("確定要重置為預設測試資料嗎？現有變更將被覆蓋。")) {
          setWarehouses(INITIAL_WAREHOUSES);
          setItems(INITIAL_ITEMS);
          showToast("已成功重置為預載資料！");
        }
      };

      return (
        <div className="max-w-4xl mx-auto px-4 py-6">
          {/* Toast 通知 */}
          {toastMsg && (
            <div className="fixed top-5 left-1/2 -translate-x-1/2 z-50 bg-cyan-400 text-slate-950 font-bold px-4 py-2.5 rounded-lg shadow-2xl flex items-center space-x-2 border border-cyan-300 transition-all animate-bounce">
              <span>🔔</span>
              <span>{toastMsg}</span>
            </div>
          )}

          {/* 頂部 Header & 儀表板 */}
          <div className="bg-slate-900 border border-slate-700/80 rounded-2xl p-5 mb-5 shadow-xl">
            <div className="flex items-center justify-between pb-4 border-b border-slate-800">
              <div className="flex items-center space-x-3">
                <div className="w-10 h-10 rounded-xl bg-cyan-400/10 border border-cyan-400/40 flex items-center justify-center text-xl text-cyan-400 font-bold">
                  📡
                </div>
                <div>
                  <h1 className="text-xl font-bold tracking-tight text-white flex items-center space-x-2">
                    <span>NFC Smart Inventory</span>
                    <span className="text-xs bg-cyan-400/15 text-cyan-400 px-2 py-0.5 rounded font-mono border border-cyan-400/30">v1.2</span>
                  </h1>
                  <p className="text-xs text-slate-400">NFC 智慧貼紙倉庫管理 ｜ 掃描即時出入庫</p>
                </div>
              </div>

              {/* 頂部快捷按鈕 */}
              <div className="flex items-center space-x-2">
                <button
                  onClick={() => setShowSimulator(true)}
                  className="px-3 py-1.5 rounded-lg bg-cyan-400/10 hover:bg-cyan-400/20 text-cyan-400 border border-cyan-400/30 text-xs font-semibold flex items-center space-x-1 transition"
                  title="開發者模擬面板"
                >
                  <span>🔨</span>
                  <span className="hidden sm:inline">虛擬感應模擬</span>
                </button>
                <button
                  onClick={() => setShowBackupModal(true)}
                  className="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold flex items-center space-x-1 border border-slate-700 transition"
                  title="資料匯出與備份"
                >
                  <span>💾</span>
                  <span className="hidden sm:inline">備份/匯入</span>
                </button>
                <button
                  onClick={handleResetData}
                  className="p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white text-xs border border-slate-700 transition"
                  title="重置為範例"
                >
                  🔄
                </button>
                <button
                  onClick={handleClearAllData}
                  className="p-1.5 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 hover:text-rose-300 text-xs border border-rose-500/30 transition"
                  title="清空所有示範倉庫與物品"
                >
                  🗑️
                </button>
              </div>
            </div>

            {/* 統計指標卡片 */}
            <div className="grid grid-cols-3 gap-3 my-4">
              <div className="bg-slate-950/60 border border-slate-800 rounded-xl p-3">
                <div className="text-xs text-slate-400">收納物品品項</div>
                <div className="text-xl font-black text-white mt-1">{metrics.totalBoxes} <span className="text-xs font-normal text-slate-400">種</span></div>
              </div>
              <div className="bg-slate-950/60 border border-slate-800 rounded-xl p-3">
                <div className="text-xs text-slate-400">總物品件數</div>
                <div className="text-xl font-black text-emerald-400 mt-1">{metrics.totalUnits} <span className="text-xs font-normal text-slate-400">件</span></div>
              </div>
              <div
                onClick={() => setFilterOnlyExpiryAlert(!filterOnlyExpiryAlert)}
                className={`border rounded-xl p-3 cursor-pointer transition ${
                  filterOnlyExpiryAlert
                    ? 'bg-rose-500/20 border-rose-500 ring-1 ring-rose-500'
                    : 'bg-slate-950/60 border-slate-800 hover:border-amber-400/50'
                }`}
              >
                <div className="flex items-center justify-between text-xs text-slate-400">
                  <span>效期警戒狀態</span>
                  <span>⚠️</span>
                </div>
                <div className="text-sm font-bold text-rose-400 mt-1 flex items-center space-x-1">
                  <span>{metrics.expired ? `過期 ${metrics.expired}` : '無過期'}</span>
                  <span className="text-xs text-amber-400 font-normal">({metrics.expiringSoon}即期)</span>
                </div>
              </div>
            </div>

            {/* 醒目 NFC 感應主按鈕 */}
            <button
              onClick={startWebNfcScan}
              className="w-full py-3.5 px-4 bg-cyan-400 hover:bg-cyan-300 text-slate-950 font-bold rounded-xl shadow-lg shadow-cyan-950/50 flex items-center justify-center space-x-2 transition transform active:scale-[0.99]"
            >
              <span className="text-xl">📡</span>
              <span className="text-base tracking-wide">感應 NFC 倉庫貼紙 (Scan Tag)</span>
            </button>
          </div>

          {/* 導覽分頁 (雙頁籤) */}
          <div className="flex border-b border-slate-800 mb-5">
            <button
              onClick={() => setCurrentTab(0)}
              className={`pb-3 px-4 text-sm font-bold transition flex items-center space-x-2 border-b-2 ${
                currentTab === 0
                  ? 'border-cyan-400 text-cyan-400'
                  : 'border-transparent text-slate-400 hover:text-slate-200'
              }`}
            >
              <span>📦 全部物品清單</span>
              <span className="text-xs px-2 py-0.5 rounded-full bg-slate-800 text-slate-300">{filteredItems.length}</span>
            </button>
            <button
              onClick={() => setCurrentTab(1)}
              className={`pb-3 px-4 text-sm font-bold transition flex items-center space-x-2 border-b-2 ${
                currentTab === 1
                  ? 'border-cyan-400 text-cyan-400'
                  : 'border-transparent text-slate-400 hover:text-slate-200'
              }`}
            >
              <span>🏬 倉庫與收納箱總覽</span>
              <span className="text-xs px-2 py-0.5 rounded-full bg-slate-800 text-slate-300">{warehouses.length}</span>
            </button>
          </div>

          {/* TAB 0: 物品清單檢視 */}
          {currentTab === 0 && (
            <div>
              {/* 過期過濾橫幅 */}
              {filterOnlyExpiryAlert && (
                <div className="bg-rose-500/15 border border-rose-500/40 rounded-xl px-4 py-2.5 mb-4 flex items-center justify-between text-xs text-rose-300 font-semibold">
                  <span className="flex items-center space-x-2">
                    <span>🚨</span>
                    <span>已套用效期過濾：僅顯示已過期與 7 天內即期品項</span>
                  </span>
                  <button onClick={() => setFilterOnlyExpiryAlert(false)} className="text-rose-400 underline hover:text-rose-200">
                    清除過濾
                  </button>
                </div>
              )}

              {/* 搜尋與模式切換 */}
              <div className="flex items-center space-x-2 mb-3">
                <div className="relative flex-1">
                  <span className="absolute left-3 top-2.5 text-slate-400">🔍</span>
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder="搜尋物品名稱、位置、條碼、NFC UID..."
                    className="w-full pl-9 pr-8 py-2 bg-slate-900 border border-slate-700/80 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-cyan-400"
                  />
                  {searchQuery && (
                    <button
                      onClick={() => setSearchQuery("")}
                      className="absolute right-3 top-2 text-slate-400 hover:text-white"
                    >
                      ✕
                    </button>
                  )}
                </div>

                <button
                  onClick={() => setIsCompactView(!isCompactView)}
                  className="px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-cyan-400 text-sm font-semibold hover:bg-slate-800 transition"
                  title={isCompactView ? "切換為大卡片" : "切換為精簡清單"}
                >
                  {isCompactView ? "🖼️ 卡片" : "📋 精簡"}
                </button>
              </div>

              {/* 分類篩選膠囊 */}
              <div className="flex items-center space-x-2 overflow-x-auto no-scrollbar pb-3 mb-4">
                {CATEGORIES.map(cat => (
                  <button
                    key={cat}
                    onClick={() => { setSelectedCategory(cat); setFilterOnlyExpiryAlert(false); }}
                    className={`px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition border ${
                      selectedCategory === cat && !filterOnlyExpiryAlert
                        ? 'bg-cyan-400/20 text-cyan-400 border-cyan-400/60'
                        : 'bg-slate-900 text-slate-400 border-slate-800 hover:border-slate-700'
                    }`}
                  >
                    {cat}
                  </button>
                ))}
              </div>

              {/* 物品列表 */}
              {filteredItems.length === 0 ? (
                <div className="text-center py-16 bg-slate-900/40 rounded-2xl border border-slate-800">
                  <div className="text-4xl mb-3">📦</div>
                  <div className="text-sm font-bold text-slate-300">找不到符合條件的物品</div>
                  <div className="text-xs text-slate-500 mt-1">請嘗試修改關鍵字或點擊重置按鈕</div>
                </div>
              ) : isCompactView ? (
                // 精簡清單檢視
                <div className="space-y-2">
                  {filteredItems.map(item => (
                    <div
                      key={item.id}
                      className="bg-slate-900 border border-slate-800 hover:border-slate-700 rounded-xl p-3 flex items-center justify-between transition"
                    >
                      <div className="flex-1 cursor-pointer" onClick={() => { setIsCreatingNewItem(false); setEditingItem(item); }}>
                        <div className="flex items-center space-x-2">
                          <span className="font-bold text-sm text-white">{item.name}</span>
                          <span className="text-[10px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700">{item.category}</span>
                          {item.expiry_date && (
                            <span className={`text-[10px] px-1.5 py-0.5 rounded font-bold ${
                              getExpiryInfo(item.expiry_date).status === 'expired'
                                ? 'bg-rose-500/20 text-rose-400 border border-rose-500/40'
                                : getExpiryInfo(item.expiry_date).status === 'expiring_soon'
                                ? 'bg-amber-500/20 text-amber-400 border border-amber-500/40'
                                : 'bg-emerald-500/10 text-emerald-400'
                            }`}>
                              {getExpiryInfo(item.expiry_date).label.split(' ')[0]}
                            </span>
                          )}
                        </div>
                        <div className="text-xs text-slate-400 mt-1 flex items-center space-x-2">
                          <span>📍 {item.location}</span>
                          {item.nfc_uid && <span className="font-mono text-[10px] text-cyan-400">UID: {item.nfc_uid}</span>}
                        </div>
                      </div>

                      {/* 數量調節 */}
                      <div className="flex items-center space-x-2">
                        <button
                          onClick={() => handleAdjustQuantity(item.id, -1)}
                          className="w-7 h-7 rounded-lg bg-slate-800 hover:bg-slate-700 text-white flex items-center justify-center font-bold"
                        >
                          -
                        </button>
                        <span className="font-bold text-sm text-cyan-400 min-w-[24px] text-center">{item.quantity}</span>
                        <button
                          onClick={() => handleAdjustQuantity(item.id, 1)}
                          className="w-7 h-7 rounded-lg bg-cyan-400 hover:bg-cyan-300 text-slate-950 flex items-center justify-center font-bold"
                        >
                          +
                        </button>
                        <button
                          onClick={() => setCheckoutItem(item)}
                          className="px-2 py-1 text-xs rounded bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 ml-2"
                        >
                          出庫
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              ) : (
                // 卡片檢視
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  {filteredItems.map(item => {
                    const expiry = getExpiryInfo(item.expiry_date);
                    return (
                      <div
                        key={item.id}
                        className="bg-slate-900 border border-slate-800 hover:border-slate-700 rounded-2xl overflow-hidden shadow-lg transition flex flex-col justify-between"
                      >
                        <div>
                          {item.image_url && (
                            <div className="w-full h-36 bg-slate-950 relative overflow-hidden">
                              <img src={item.image_url} alt={item.name} className="w-full h-full object-cover" />
                              <span className="absolute top-2 right-2 text-xs bg-slate-950/80 backdrop-blur px-2 py-1 rounded-md text-cyan-400 border border-slate-700 font-semibold">
                                {item.category}
                              </span>
                            </div>
                          )}

                          <div className="p-4">
                            <div className="flex items-start justify-between">
                              <h3
                                onClick={() => { setIsCreatingNewItem(false); setEditingItem(item); }}
                                className="font-bold text-base text-white hover:text-cyan-400 cursor-pointer"
                              >
                                {item.name}
                              </h3>
                              {!item.image_url && (
                                <span className="text-xs bg-slate-800 text-slate-300 px-2 py-0.5 rounded border border-slate-700">
                                  {item.category}
                                </span>
                              )}
                            </div>

                            {/* 效期標記 */}
                            {item.expiry_date && (
                              <div className={`mt-2 text-xs px-2.5 py-1 rounded-md font-bold inline-block border ${
                                expiry.status === 'expired'
                                  ? 'bg-rose-500/15 text-rose-400 border-rose-500/40'
                                  : expiry.status === 'expiring_soon'
                                  ? 'bg-amber-500/15 text-amber-400 border-amber-500/40'
                                  : 'bg-emerald-500/15 text-emerald-400 border-emerald-500/30'
                              }`}>
                                {expiry.label}
                              </div>
                            )}

                            <div className="text-xs text-slate-400 mt-2 flex items-center space-x-1">
                              <span>📍</span>
                              <span className="truncate">{item.location}</span>
                            </div>

                            {item.nfc_uid && (
                              <div className="mt-1 text-[11px] font-mono text-cyan-400 flex items-center space-x-1">
                                <span>🏷️</span>
                                <span>{item.nfc_uid}</span>
                              </div>
                            )}
                            {item.barcode && (
                              <div className="mt-1 text-[11px] font-mono text-emerald-400 flex items-center space-x-1">
                                <span>▌║▌</span>
                                <span>條碼: {item.barcode}</span>
                              </div>
                            )}

                            {item.notes && (
                              <p className="text-xs text-slate-400 mt-2 line-clamp-2 bg-slate-950/40 p-2 rounded-lg border border-slate-800/80">
                                {item.notes}
                              </p>
                            )}
                          </div>
                        </div>

                        {/* 卡片底座快捷按鈕列 */}
                        <div className="p-3 bg-slate-950/60 border-t border-slate-800/80 flex items-center justify-between">
                          <div className="flex items-center space-x-1.5">
                            <button
                              onClick={() => setCheckoutItem(item)}
                              className="px-2.5 py-1 text-xs bg-slate-800 hover:bg-slate-700 text-cyan-400 rounded-md border border-slate-700 font-semibold"
                            >
                              出庫
                            </button>
                            <button
                              onClick={() => setTransferItem(item)}
                              className="px-2.5 py-1 text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-md border border-slate-700 font-semibold"
                            >
                              轉移
                            </button>
                          </div>

                          <div className="flex items-center space-x-2">
                            <button
                              onClick={() => handleAdjustQuantity(item.id, -1)}
                              className="w-7 h-7 rounded-lg bg-slate-800 hover:bg-slate-700 text-white flex items-center justify-center font-bold text-sm"
                            >
                              -
                            </button>
                            <span className="font-bold text-sm text-white px-1">{item.quantity}</span>
                            <button
                              onClick={() => handleAdjustQuantity(item.id, 1)}
                              className="w-7 h-7 rounded-lg bg-cyan-400 hover:bg-cyan-300 text-slate-950 flex items-center justify-center font-bold text-sm"
                            >
                              +
                            </button>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          {/* TAB 1: 倉庫與收納箱總覽 */}
          {currentTab === 1 && (
            <div className="space-y-4">
              <div className="flex flex-wrap items-center justify-between gap-3 bg-slate-900 border border-slate-800 rounded-xl p-4">
                <div>
                  <h3 className="font-bold text-sm text-white">📡 倉庫與收納箱總覽</h3>
                  <p className="text-xs text-slate-400 mt-0.5">點擊卡片展開倉內物品進行出入庫，或點擊「🗑️ 刪除」移除不需要的倉庫</p>
                </div>
                <div className="flex items-center space-x-2">
                  {warehouses.length > 0 && (
                    <button
                      onClick={handleClearAllData}
                      className="px-3 py-2 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 text-xs font-bold rounded-lg transition flex items-center space-x-1"
                    >
                      <span>🗑️</span>
                      <span>清空全部倉庫</span>
                    </button>
                  )}
                  <button
                    onClick={() => { setCreateWarehouseUid(""); setShowCreateWarehouseModal(true); }}
                    className="px-3 py-2 bg-cyan-400 hover:bg-cyan-300 text-slate-950 text-xs font-bold rounded-lg shadow"
                  >
                    ＋ 建立新倉庫貼紙
                  </button>
                </div>
              </div>

              {warehouses.length === 0 ? (
                <div className="text-center py-14 bg-slate-900/50 border border-slate-800 rounded-2xl">
                  <div className="text-4xl mb-3">🏬</div>
                  <h3 className="text-base font-bold text-white">目前沒有任何倉庫或收納箱</h3>
                  <p className="text-xs text-slate-400 mt-1 mb-5">您可以建立自己的倉庫並綁定 NFC 貼紙，或重新載入範例資料</p>
                  <div className="flex items-center justify-center space-x-3">
                    <button
                      onClick={handleResetData}
                      className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold rounded-xl border border-slate-700 transition"
                    >
                      🔄 載入範例倉庫
                    </button>
                    <button
                      onClick={() => { setCreateWarehouseUid(""); setShowCreateWarehouseModal(true); }}
                      className="px-4 py-2 bg-cyan-400 hover:bg-cyan-300 text-slate-950 text-xs font-bold rounded-xl shadow transition"
                    >
                      ＋ 新增倉庫
                    </button>
                  </div>
                </div>
              ) : (
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  {warehouses.map(wh => {
                    const storedItems = items.filter(i => i.location === wh.name);
                    const totalUnits = storedItems.reduce((acc, i) => acc + (i.quantity || 0), 0);
                    const hasExpired = storedItems.some(i => getExpiryInfo(i.expiry_date).status === 'expired');

                    return (
                      <div
                        key={wh.id}
                        onClick={() => setActiveWarehouse(wh)}
                        className="bg-slate-900 border border-slate-800 hover:border-cyan-400/60 rounded-2xl p-4 cursor-pointer transition shadow-lg group relative"
                      >
                        {hasExpired && (
                          <span className="absolute top-3 right-3 text-[10px] bg-rose-500/20 text-rose-400 px-2 py-0.5 rounded-full font-bold border border-rose-500/40">
                            ⚠️ 內含過期品
                          </span>
                        )}

                        <div className="flex items-center space-x-3">
                          <div className="w-12 h-12 rounded-xl bg-slate-950 border border-slate-700/80 flex items-center justify-center text-2xl group-hover:scale-105 transition">
                            {wh.icon || '📦'}
                          </div>
                          <div>
                            <h4 className="font-bold text-base text-white group-hover:text-cyan-400 transition">{wh.name}</h4>
                            <div className="text-xs text-slate-400 mt-0.5">
                              共收納 <span className="text-cyan-400 font-bold">{storedItems.length}</span> 種品項 ({totalUnits} 件)
                            </div>
                          </div>
                        </div>

                        {wh.description && (
                          <p className="text-xs text-slate-400 mt-3 line-clamp-2 bg-slate-950/40 p-2 rounded-lg border border-slate-800">
                            {wh.description}
                          </p>
                        )}

                        <div className="mt-3 pt-3 border-t border-slate-800/80 flex items-center justify-between text-xs text-slate-400">
                          <span className="font-mono text-cyan-400">{wh.nfc_uid ? `🏷️ UID: ${wh.nfc_uid}` : '未綁定貼紙'}</span>
                          <div className="flex items-center space-x-2">
                            <button
                              onClick={(e) => {
                                e.stopPropagation();
                                handleDeleteWarehouse(wh.id);
                              }}
                              className="px-2 py-1 rounded-md bg-rose-500/10 text-rose-400 hover:bg-rose-500/20 border border-rose-500/20 font-semibold transition flex items-center space-x-1"
                              title="刪除此倉庫"
                            >
                              <span>🗑️</span>
                              <span>刪除</span>
                            </button>
                            <span className="group-hover:translate-x-1 transition text-cyan-400 font-semibold">展開看板 →</span>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          {/* 浮動快捷新增按鈕 */}
          <div className="fixed bottom-6 right-6 z-40 flex items-center space-x-3">
            <button
              onClick={() => {
                setIsCreatingNewItem(true);
                setPrefilledLoc(activeWarehouse ? activeWarehouse.name : "");
                setPrefilledUid("");
                setEditingItem({
                  name: "",
                  category: "食品生鮮",
                  location: activeWarehouse ? activeWarehouse.name : "廚房冰箱 - 冷藏庫",
                  quantity: 1,
                  notes: "",
                  image_url: "",
                  expiry_date: null
                });
              }}
              className="py-3 px-5 bg-cyan-400 hover:bg-cyan-300 text-slate-950 font-black rounded-full shadow-2xl flex items-center space-x-2 transition transform hover:scale-105 active:scale-95 border-2 border-slate-900"
            >
              <span>＋</span>
              <span>新增物品/食材</span>
            </button>
          </div>

          {/* ===================== MODALS ===================== */}

          {/* 1. 核心看板：WarehouseHubSheet (掃描倉庫貼紙後打開的倉庫總看板) */}
          {activeWarehouse && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className="bg-slate-900 border border-slate-700 w-full max-w-2xl max-h-[90vh] rounded-t-3xl sm:rounded-2xl p-5 overflow-hidden flex flex-col shadow-2xl">
                {/* 倉庫看板頭部 */}
                <div className="flex items-start justify-between pb-4 border-b border-slate-800">
                  <div className="flex items-center space-x-3">
                    <span className="text-4xl">{activeWarehouse.icon || '📦'}</span>
                    <div>
                      <h2 className="text-xl font-black text-white">{activeWarehouse.name}</h2>
                      <div className="text-xs text-cyan-400 font-mono flex items-center space-x-2 mt-0.5">
                        <span>🏷️ NFC 貼紙: {activeWarehouse.nfc_uid || '未綁定'}</span>
                      </div>
                    </div>
                  </div>
                  <div className="flex items-center space-x-2">
                    <button
                      onClick={() => handleDeleteWarehouse(activeWarehouse.id)}
                      className="px-2.5 py-1 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 text-xs font-semibold flex items-center space-x-1 transition"
                      title="刪除此倉庫"
                    >
                      <span>🗑️</span>
                      <span>刪除倉庫</span>
                    </button>
                    <button onClick={() => setActiveWarehouse(null)} className="text-slate-400 hover:text-white text-xl p-1">✕</button>
                  </div>
                </div>

                {activeWarehouse.description && (
                  <p className="text-xs text-slate-400 mt-2 px-1">{activeWarehouse.description}</p>
                )}

                {/* 倉內統計條 */}
                {(() => {
                  const whItems = items.filter(i => i.location === activeWarehouse.name);
                  const totalQty = whItems.reduce((acc, i) => acc + (i.quantity || 0), 0);
                  const expired = whItems.filter(i => getExpiryInfo(i.expiry_date).status === 'expired').length;
                  const expiring = whItems.filter(i => getExpiryInfo(i.expiry_date).status === 'expiring_soon').length;

                  return (
                    <div className="my-3 grid grid-cols-3 gap-2 text-center text-xs">
                      <div className="bg-slate-950 p-2 rounded-lg border border-slate-800">
                        <div className="text-slate-400">收納項目</div>
                        <div className="text-base font-bold text-white mt-0.5">{whItems.length} 種</div>
                      </div>
                      <div className="bg-slate-950 p-2 rounded-lg border border-slate-800">
                        <div className="text-slate-400">總件數</div>
                        <div className="text-base font-bold text-emerald-400 mt-0.5">{totalQty} 件</div>
                      </div>
                      <div className="bg-slate-950 p-2 rounded-lg border border-slate-800">
                        <div className="text-slate-400">效期注意</div>
                        <div className="text-base font-bold text-rose-400 mt-0.5">
                          {expired ? `${expired}件過期` : (expiring ? `${expiring}件即期` : '正常')}
                        </div>
                      </div>
                    </div>
                  );
                })()}

                {/* 3-Tab 模式切換列：倉內出入庫 / 快速入庫與調撥 / 倉庫設定 */}
                <div className="grid grid-cols-3 gap-1.5 bg-slate-950 p-1 rounded-xl border border-slate-800 mb-3">
                  <button
                    onClick={() => setWarehouseHubTab('inventory')}
                    className={`py-2 rounded-lg text-xs font-bold transition ${
                      warehouseHubTab === 'inventory' ? 'bg-cyan-400 text-slate-950 shadow' : 'text-slate-400 hover:text-white'
                    }`}
                  >
                    📦 倉內出入庫 ({items.filter(i => i.location === activeWarehouse.name).length})
                  </button>
                  <button
                    onClick={() => setWarehouseHubTab('inbound')}
                    className={`py-2 rounded-lg text-xs font-bold transition ${
                      warehouseHubTab === 'inbound' ? 'bg-cyan-400 text-slate-950 shadow' : 'text-slate-400 hover:text-white'
                    }`}
                  >
                    📥 快速入庫 / 調撥
                  </button>
                  <button
                    onClick={() => setWarehouseHubTab('settings')}
                    className={`py-2 rounded-lg text-xs font-bold transition ${
                      warehouseHubTab === 'settings' ? 'bg-cyan-400 text-slate-950 shadow' : 'text-slate-400 hover:text-white'
                    }`}
                  >
                    ⚙️ 倉庫設定
                  </button>
                </div>

                {/* 商品條碼掃描選項開關 */}
                <div className="mb-3 bg-slate-950/80 border border-slate-800 rounded-xl px-3 py-2 flex items-center justify-between gap-2">
                  <div className="flex items-center space-x-2">
                    <span className="text-sm">▌║▌</span>
                    <div>
                      <div className="text-xs font-bold text-slate-200">是否啟用商品條碼掃描</div>
                      <div className="text-[10px] text-slate-400">可自由切換手動出入庫或掃描條碼快速匹配</div>
                    </div>
                  </div>
                  <button
                    type="button"
                    onClick={() => setEnableBarcodeInHub(v => !v)}
                    className={`px-3 py-1.5 rounded-lg text-xs font-bold border transition ${
                      enableBarcodeInHub
                        ? 'bg-emerald-400/20 text-emerald-300 border-emerald-400/50'
                        : 'bg-slate-800 text-slate-400 border-slate-700'
                    }`}
                  >
                    {enableBarcodeInHub ? '✅ 已開啟條碼掃描' : '⚪ 關閉（手動）'}
                  </button>
                </div>

                {/* Tab 內容區 */}
                {warehouseHubTab === 'inventory' && (
                  <>
                    <div className="flex flex-wrap items-center gap-2 mb-3">
                      <button
                        type="button"
                        onClick={() => setWarehouseHubTab('inbound')}
                        className="flex-1 min-w-[140px] py-2.5 bg-cyan-400 hover:bg-cyan-300 text-slate-950 font-bold rounded-xl text-sm flex items-center justify-center space-x-1.5 transition"
                      >
                        <span>📥</span>
                        <span>極速入庫 / 調撥</span>
                      </button>
                      {enableBarcodeInHub && (
                        <button
                          type="button"
                          onClick={() => setBarcodeScannerTarget('hub_inventory')}
                          className="py-2.5 px-3.5 bg-emerald-400 hover:bg-emerald-300 text-slate-950 font-bold rounded-xl text-xs flex items-center space-x-1.5 transition"
                        >
                          <span>📷</span>
                          <span>掃商品條碼出入庫</span>
                        </button>
                      )}
                      <button
                        type="button"
                        onClick={() => {
                          setIsCreatingNewItem(true);
                          setEditingItem({
                            name: "",
                            barcode: "",
                            category: "食品生鮮",
                            location: activeWarehouse.name,
                            quantity: 1,
                            notes: "",
                            image_url: "",
                            expiry_date: null
                          });
                        }}
                        className="px-3.5 py-2.5 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-xl text-xs border border-slate-700 transition"
                      >
                        ＋ 完整新增
                      </button>
                    </div>

                    {/* 條碼掃描命中快速出入庫卡片 */}
                    {scannedBarcodeMatch && (() => {
                      const liveMatch = items.find(i => i.id === scannedBarcodeMatch.item.id) || scannedBarcodeMatch.item;
                      return (
                        <div className="mb-3 bg-emerald-500/10 border border-emerald-400/50 rounded-xl p-3 space-y-2">
                          <div className="flex items-center justify-between">
                            <div className="text-xs font-bold text-emerald-300">
                              📷 條碼匹配 ({scannedBarcodeMatch.barcode})：{liveMatch.name}
                            </div>
                            <button
                              type="button"
                              onClick={() => setScannedBarcodeMatch(null)}
                              className="text-slate-400 hover:text-white text-xs"
                            >
                              ✕
                            </button>
                          </div>
                          {scannedBarcodeMatch.inActiveWarehouse ? (
                            <div className="flex items-center justify-between gap-2">
                              <span className="text-xs text-slate-300">
                                目前庫存：<span className="font-black text-white">{liveMatch.quantity}</span> 件
                              </span>
                              <div className="flex items-center space-x-1.5">
                                <button
                                  type="button"
                                  onClick={() => { handleAdjustQuantity(liveMatch.id, -1); showToast(`已出庫 1 件「${liveMatch.name}」`); }}
                                  className="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold border border-slate-700"
                                >
                                  -1 出庫
                                </button>
                                <button
                                  type="button"
                                  onClick={() => { handleAdjustQuantity(liveMatch.id, 1); showToast(`已入庫 1 件「${liveMatch.name}」`); }}
                                  className="px-2.5 py-1.5 rounded-lg bg-cyan-400 hover:bg-cyan-300 text-slate-950 text-xs font-bold"
                                >
                                  +1 入庫
                                </button>
                                <button
                                  type="button"
                                  onClick={() => setCheckoutItem(liveMatch)}
                                  className="px-2.5 py-1.5 rounded-lg bg-slate-800 text-cyan-400 text-xs font-bold border border-slate-700"
                                >
                                  出庫登記
                                </button>
                              </div>
                            </div>
                          ) : (
                            <div className="flex items-center justify-between gap-2">
                              <span className="text-xs text-slate-300">
                                目前位於「{liveMatch.location}」(庫存 {liveMatch.quantity})
                              </span>
                              <button
                                type="button"
                                onClick={() => {
                                  handleTransferInToActiveWarehouse(liveMatch);
                                  setScannedBarcodeMatch(null);
                                }}
                                className="px-3 py-1.5 rounded-lg bg-emerald-400 hover:bg-emerald-300 text-slate-950 text-xs font-bold"
                              >
                                📥 調入此倉
                              </button>
                            </div>
                          )}
                        </div>
                      );
                    })()}

                    {/* 倉內物品列表 */}
                    <div className="flex-1 overflow-y-auto space-y-2 pr-1">
                      {items.filter(i => i.location === activeWarehouse.name).length === 0 ? (
                        <div className="text-center py-10 text-slate-500 text-xs">
                          此倉庫目前為空，點選上方「📥 極速入庫 / 調撥」放入物品
                        </div>
                      ) : (
                        items.filter(i => i.location === activeWarehouse.name).map(it => {
                          const expiry = getExpiryInfo(it.expiry_date);
                          return (
                            <div
                              key={it.id}
                              className="bg-slate-950/80 border border-slate-800 rounded-xl p-3 flex items-center justify-between"
                            >
                              <div className="flex-1 cursor-pointer" onClick={() => { setIsCreatingNewItem(false); setEditingItem(it); }}>
                                <div className="font-bold text-sm text-white">{it.name}</div>
                                {it.expiry_date && (
                                  <div className={`text-[11px] font-semibold mt-0.5 ${
                                    expiry.status === 'expired' ? 'text-rose-400' : (expiry.status === 'expiring_soon' ? 'text-amber-400' : 'text-emerald-400')
                                  }`}>
                                    {expiry.label}
                                  </div>
                                )}
                                {it.barcode && (
                                  <div className="text-[10px] font-mono text-emerald-400/90 mt-0.5">▌║▌ {it.barcode}</div>
                                )}
                                {it.notes && <div className="text-[11px] text-slate-500 line-clamp-1 mt-0.5">{it.notes}</div>}
                              </div>

                              <div className="flex items-center space-x-2 ml-2">
                                <button
                                  type="button"
                                  onClick={() => handleAdjustQuantity(it.id, -1)}
                                  className="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-white font-bold flex items-center justify-center"
                                  title="出庫 1 件"
                                >
                                  -
                                </button>
                                <span className="font-black text-sm text-white min-w-[20px] text-center">{it.quantity}</span>
                                <button
                                  type="button"
                                  onClick={() => handleAdjustQuantity(it.id, 1)}
                                  className="w-8 h-8 rounded-lg bg-cyan-400 hover:bg-cyan-300 text-slate-950 font-bold flex items-center justify-center"
                                  title="入庫 1 件"
                                >
                                  +
                                </button>
                                <button
                                  type="button"
                                  onClick={() => setCheckoutItem(it)}
                                  className="text-xs px-2 py-1 bg-slate-800 hover:bg-slate-700 text-cyan-400 rounded border border-slate-700 ml-1"
                                >
                                  出庫登記
                                </button>
                              </div>
                            </div>
                          );
                        })
                      )}
                    </div>
                  </>
                )}

                {warehouseHubTab === 'inbound' && (
                  <div className="flex-1 overflow-y-auto space-y-4 pr-1">
                    {/* 極速入庫表單 */}
                    <form onSubmit={handleQuickInboundToWarehouse} className="bg-slate-950/90 border border-cyan-400/40 rounded-xl p-4 space-y-3">
                      <div className="flex items-center justify-between">
                        <h4 className="font-bold text-sm text-cyan-400">📥 極速新增入庫至「{activeWarehouse.name}」</h4>
                        {enableBarcodeInHub && (
                          <button
                            type="button"
                            onClick={() => setBarcodeScannerTarget('hub_inbound')}
                            className="px-2.5 py-1 rounded-lg bg-emerald-400/15 hover:bg-emerald-400/25 text-emerald-300 border border-emerald-400/40 text-xs font-bold"
                          >
                            📷 掃商品條碼
                          </button>
                        )}
                      </div>
                      {enableBarcodeInHub && (
                        <input
                          type="text"
                          placeholder="商品條碼（可點擊右上掃描或略過）"
                          value={quickInboundForm.barcode}
                          onChange={(e) => setQuickInboundForm({ ...quickInboundForm, barcode: e.target.value })}
                          className="w-full px-3 py-2 bg-slate-900 border border-emerald-500/40 rounded-lg text-xs font-mono text-emerald-300 focus:border-cyan-400 focus:outline-none"
                        />
                      )}
                      <input
                        type="text"
                        required
                        placeholder="物品或食材名稱 *（如：鮮奶、ESP32、電池）"
                        value={quickInboundForm.name}
                        onChange={(e) => setQuickInboundForm({ ...quickInboundForm, name: e.target.value })}
                        className="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white focus:border-cyan-400 focus:outline-none"
                      />
                      <div className="grid grid-cols-2 gap-2">
                        <select
                          value={quickInboundForm.category}
                          onChange={(e) => setQuickInboundForm({ ...quickInboundForm, category: e.target.value })}
                          className="px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-xs text-white"
                        >
                          {CATEGORIES.filter(c => c !== "全部").map(c => <option key={c} value={c}>{c}</option>)}
                        </select>
                        <div className="flex items-center space-x-2 bg-slate-900 border border-slate-700 rounded-lg px-2 py-1">
                          <span className="text-xs text-slate-400">數量</span>
                          <input
                            type="number"
                            min="1"
                            value={quickInboundForm.quantity}
                            onChange={(e) => setQuickInboundForm({ ...quickInboundForm, quantity: e.target.value })}
                            className="w-full bg-transparent text-white font-bold text-sm text-center focus:outline-none"
                          />
                        </div>
                      </div>

                      {/* 有效日期選擇：無有效日期 vs 設定天數 */}
                      <div className="bg-slate-900/90 border border-slate-800 rounded-xl p-2.5 space-y-2">
                        <div className="flex flex-wrap items-center justify-between gap-2">
                          <span className="text-xs font-semibold text-slate-300">有效日期（選填）</span>
                          <div className="flex items-center gap-1.5">
                            <button
                              type="button"
                              onClick={() => setQuickInboundForm(prev => ({ ...prev, hasExpiry: false }))}
                              className={`px-2.5 py-1 rounded-lg text-[11px] font-bold border transition ${
                                !quickInboundForm.hasExpiry
                                  ? 'bg-cyan-400/20 text-cyan-300 border-cyan-400/60'
                                  : 'bg-slate-950 text-slate-400 border-slate-700 hover:text-white'
                              }`}
                            >
                              無有效日期
                            </button>
                            <button
                              type="button"
                              onClick={() => setQuickInboundForm(prev => ({ ...prev, hasExpiry: true, expiryDays: prev.expiryDays || "7" }))}
                              className={`px-2.5 py-1 rounded-lg text-[11px] font-bold border transition ${
                                quickInboundForm.hasExpiry
                                  ? 'bg-emerald-400/20 text-emerald-300 border-emerald-400/60'
                                  : 'bg-slate-950 text-slate-400 border-slate-700 hover:text-white'
                              }`}
                            >
                              設定效期天數
                            </button>
                          </div>
                        </div>

                        {quickInboundForm.hasExpiry ? (
                          <div className="flex flex-wrap items-center gap-2">
                            <div className="flex items-center space-x-1.5 bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1 w-32">
                              <span className="text-xs text-slate-400">有效</span>
                              <input
                                type="number"
                                min="0"
                                placeholder="天數"
                                value={quickInboundForm.expiryDays}
                                onChange={(e) => setQuickInboundForm({ ...quickInboundForm, expiryDays: e.target.value })}
                                className="w-full bg-transparent text-emerald-400 font-bold text-sm text-center focus:outline-none"
                              />
                              <span className="text-xs text-slate-400">天</span>
                            </div>
                            {[7, 30, 90, 365].map(d => (
                              <button
                                key={d}
                                type="button"
                                onClick={() => setQuickInboundForm(prev => ({ ...prev, hasExpiry: true, expiryDays: String(d) }))}
                                className="text-[11px] px-2 py-1 rounded-md bg-slate-950 text-cyan-400 border border-slate-800 hover:border-cyan-400/50"
                              >
                                +{d === 365 ? '1年' : `${d}天`}
                              </button>
                            ))}
                          </div>
                        ) : (
                          <div className="text-[11px] text-slate-400">
                            目前設為「無有效日期」，入庫後不會發出過期提醒（若需追蹤可點右側「設定效期天數」）。
                          </div>
                        )}
                      </div>
                      <input
                        type="text"
                        placeholder="備註 (選填)"
                        value={quickInboundForm.notes}
                        onChange={(e) => setQuickInboundForm({ ...quickInboundForm, notes: e.target.value })}
                        className="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-xs text-white focus:outline-none"
                      />
                      <button
                        type="submit"
                        className="w-full py-2.5 bg-cyan-400 hover:bg-cyan-300 text-slate-950 font-bold rounded-xl text-sm transition"
                      >
                        ✅ 確認入庫到此倉庫
                      </button>
                    </form>

                    {/* 從其他倉庫調撥入庫 */}
                    {items.some(i => i.location !== activeWarehouse.name) && (
                      <div className="space-y-2">
                        <h4 className="font-bold text-sm text-white">🔄 從其他倉庫快速調撥入庫</h4>
                        <input
                          type="text"
                          placeholder="搜尋其他倉庫中的物品..."
                          value={transferSearch}
                          onChange={(e) => setTransferSearch(e.target.value)}
                          className="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-xs text-white focus:border-cyan-400 focus:outline-none"
                        />
                        <div className="space-y-2">
                          {items
                            .filter(i => i.location !== activeWarehouse.name && (!transferSearch.trim() || i.name.toLowerCase().includes(transferSearch.toLowerCase()) || i.location.toLowerCase().includes(transferSearch.toLowerCase())))
                            .slice(0, 12)
                            .map(candidate => (
                              <div key={candidate.id} className="bg-slate-950 border border-slate-800 rounded-xl p-2.5 flex items-center justify-between">
                                <div>
                                  <div className="text-sm font-bold text-white">{candidate.name}</div>
                                  <div className="text-[11px] text-slate-400">原位置：{candidate.location} ｜ 庫存：{candidate.quantity}</div>
                                </div>
                                <button
                                  onClick={() => handleTransferInToActiveWarehouse(candidate)}
                                  className="px-3 py-1.5 bg-emerald-400 hover:bg-emerald-300 text-slate-950 font-bold text-xs rounded-lg transition"
                                >
                                  📥 調入此倉
                                </button>
                              </div>
                            ))}
                        </div>
                      </div>
                    )}
                  </div>
                )}

                {warehouseHubTab === 'settings' && (
                  <form onSubmit={handleUpdateWarehouseSettings} className="flex-1 overflow-y-auto space-y-3 pr-1">
                    <h4 className="font-bold text-sm text-cyan-400">⚙️ 編輯倉庫與貼紙設定</h4>
                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1">倉庫 / 收納箱名稱 *</label>
                      <input
                        type="text"
                        required
                        value={warehouseEditForm.name}
                        onChange={(e) => setWarehouseEditForm({ ...warehouseEditForm, name: e.target.value })}
                        className="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-sm text-white focus:border-cyan-400 focus:outline-none"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1">綁定 NFC 貼紙 UID</label>
                      <input
                        type="text"
                        value={warehouseEditForm.nfc_uid}
                        onChange={(e) => setWarehouseEditForm({ ...warehouseEditForm, nfc_uid: e.target.value.toUpperCase() })}
                        placeholder="例如 04:D1:22:90"
                        className="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-sm font-mono text-cyan-400 focus:border-cyan-400 focus:outline-none"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1">選擇代表圖示</label>
                      <div className="flex flex-wrap gap-2">
                        {["🧊", "❄️", "📦", "🧰", "🧥", "⛺", "🔐"].map(ic => (
                          <button
                            key={ic}
                            type="button"
